<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑暗中行走</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            background: #000000;
        }

        #gifContainer {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #gifContainer img {
            width: 1000px;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="gifContainer">
        <img src="test.gif" alt="walking animation" onload="console.log('GIF loaded!')" onerror="console.log('GIF failed to load')">
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gifContainer = document.getElementById('gifContainer');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let sphereVisible = true;
        let ropeEndY = 0;
        let ropeDropping = false;
        const ropeWidth = 4;
        let ropeX = canvas.width / 2 + 60;
        let scrollOffset = 0;
        let isScrolling = false;
        let assistantScrollOffset = 0;
        let assistantScrolling = false;
        let assistantScrollDirection = 0;
        let assistantPageReached = false;
        let assistantPageEnteredAt = null;
        let portfolioReached = false; // 標記是否已到達 portfolio 頁面

        // Pacman 動畫相關
        const pacmanImages = [];
        let pacmanLoaded = false;
        let pacmanX = -100;
        const pacmanSpeed = 3;

        const assistantImage = new Image();
        let assistantLoaded = false;
        assistantImage.onload = () => {
            assistantLoaded = true;
        };
        assistantImage.src = '../Halfbody Female by Sutemo.png';

        // 載入 Pacman 圖片
        for (let i = 1; i <= 3; i++) {
            const img = new Image();
            img.src = `pacman/${i}.png`;
            img.onload = () => {
                if (i === 3) pacmanLoaded = true;
            };
            pacmanImages.push(img);
        }

        // Blinky 幽靈相關
        const blinkyImage = new Image();
        blinkyImage.src = 'pacman/blinky.png';
        let blinkyLoaded = false;
        blinkyImage.onload = () => {
            blinkyLoaded = true;
        };

        // 獲取當前繩子的抖動偏移
        function getRopeShake() {
            const time = Date.now() / 1000;
            return Math.sin(time * 3) * 2; // 左右抖動 2px
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ropeX = canvas.width / 2 + 60;

            if (portfolioReached) {
                scrollOffset = canvas.height;
            }

            if (assistantPageReached) {
                assistantScrollOffset = canvas.height;
            } else {
                assistantScrollOffset = Math.min(assistantScrollOffset, canvas.height);
            }
        });

        window.addEventListener('wheel', (e) => {
            if (!portfolioReached || isScrolling || assistantScrolling) return;

            if (e.deltaY > 0 && !assistantPageReached) {
                assistantScrolling = true;
                assistantScrollDirection = 1;
                e.preventDefault();
            } else if (e.deltaY < 0 && assistantScrollOffset > 0) {
                assistantScrolling = true;
                assistantScrollDirection = -1;
                e.preventDefault();
            }
        }, { passive: false });

        canvas.addEventListener('click', (e) => {
            // 點擊球體
            if (sphereVisible) {
                const sphereX = canvas.width - 80;
                const sphereY = 80;
                const sphereRadius = 30;

                const dx = e.clientX - sphereX;
                const dy = e.clientY - sphereY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance <= sphereRadius) {
                    sphereVisible = false;
                    ropeDropping = true;
                    return;
                }
            }

            // 點擊繩子
            if (ropeDropping && !isScrolling) {
                const clickX = e.clientX;
                const clickY = e.clientY;

                if (clickX >= ropeX - 10 && clickX <= ropeX + 10 &&
                    clickY >= 0 && clickY <= ropeEndY) {
                    isScrolling = true;
                }
            }

            // 點擊 email（在 portfolio 頁面）
            if (scrollOffset >= canvas.height && assistantScrollOffset === 0 && !assistantScrolling) {
                const emailY = canvas.height / 3 + 110;
                const emailX = canvas.width / 2;

                // 檢測點擊區域（email 文字範圍）
                if (Math.abs(e.clientX - emailX) < 150 &&
                    Math.abs(e.clientY - emailY) < 15) {
                    window.location.href = 'mailto:junmingpang@outlook.com';
                }
            }
        });

        function drawRoundedRect(x, y, width, height, radius) {
            const r = Math.min(radius, width / 2, height / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + width - r, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + r);
            ctx.lineTo(x + width, y + height - r);
            ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
            ctx.lineTo(x + r, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function wrapText(text, x, y, maxWidth, lineHeight, maxLines) {
            let line = '';
            let lineCount = 0;

            for (let i = 0; i < text.length; i++) {
                const testLine = line + text[i];

                if (ctx.measureText(testLine).width > maxWidth && line.length > 0) {
                    ctx.fillText(line, x, y);
                    line = text[i];
                    y += lineHeight;
                    lineCount++;

                    if (lineCount >= maxLines - 1) {
                        break;
                    }
                } else {
                    line = testLine;
                }
            }

            if (lineCount < maxLines && line.length > 0) {
                ctx.fillText(line, x, y);
            }
        }

        function drawSphere() {
            if (!sphereVisible) return;

            const x = canvas.width - 80;
            const y = 80;
            const radius = 30;

            // 繪製球體
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();

            // 繪製點擊提示符號（波紋擴散效果）
            const time = Date.now() / 1000;

            // 繪製在球體正中間
            const iconX = x;
            const iconY = y;

            ctx.save();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 繪製多個波紋，每個波紋間隔一段時間
            for (let i = 0; i < 3; i++) {
                // 每個波紋延遲 1.2 秒，總週期 3.6 秒
                const waveTime = (time * 0.4 + i * 1.2) % 3.6; // 0-3.6 秒循環
                const progress = waveTime / 3.6; // 0-1 的進度

                // 波紋從小到大擴散
                const waveRadius = 5 + progress * 45; // 從 5px 擴散到 50px

                // 大部分時間保持清晰，接近消失時慢慢變透明
                let waveOpacity;
                if (progress < 0.7) {
                    waveOpacity = 1; // 前 70% 保持完全不透明
                } else {
                    waveOpacity = 1 - (progress - 0.7) / 0.3; // 後 30% 慢慢淡出到 0
                }

                if (waveOpacity > 0.01) {
                    ctx.globalAlpha = waveOpacity;
                    ctx.beginPath();
                    ctx.arc(iconX, iconY, waveRadius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            ctx.restore();
        }

        function drawRope() {
            if (!ropeDropping) return;

            // 只有在未點擊時才有抖動效果，點擊後停止抖動
            const shake = isScrolling ? 0 : getRopeShake();

            ctx.fillStyle = 'white';
            ctx.fillRect(ropeX - ropeWidth / 2 + shake, 0, ropeWidth, ropeEndY);

            if (ropeEndY < canvas.height / 2 - 50) {
                ropeEndY += 5;
            }
        }

        function drawSciFiPortfolio() {
            // 黑色背景
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 科幻網格背景效果
            const time = Date.now() / 1000;
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.1;

            // 垂直線
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            // 水平線
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            ctx.globalAlpha = 1;

            // 主標題 - 科幻字體效果
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // 發光效果
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ff00';
            ctx.fillStyle = '#00ff00';
            ctx.font = 'bold 72px Arial';
            ctx.fillText('PANG JUN MING', canvas.width / 2, canvas.height / 3);

            ctx.shadowBlur = 15;
            ctx.font = 'bold 36px Arial';
            ctx.fillText('PORTFOLIO', canvas.width / 2, canvas.height / 3 + 60);

            // Email 文字（可點擊）
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#00ff00';
            ctx.font = '20px Arial';
            const emailText = 'junmingpang@outlook.com';
            const emailY = canvas.height / 3 + 110;
            ctx.fillText(emailText, canvas.width / 2, emailY);

            // 添加下劃線表示可點擊
            const textWidth = ctx.measureText(emailText).width;
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2 - textWidth / 2, emailY + 5);
            ctx.lineTo(canvas.width / 2 + textWidth / 2, emailY + 5);
            ctx.stroke();

            ctx.restore();

            // 繪製動態掃描線
            const scanY = (time * 100) % canvas.height;
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.moveTo(0, scanY);
            ctx.lineTo(canvas.width, scanY);
            ctx.stroke();
            ctx.globalAlpha = 1;

            // 左下角系統信息
            ctx.fillStyle = '#00ff00';
            ctx.font = '14px monospace';
            ctx.textAlign = 'left';
            ctx.fillText('> SYSTEM: ACTIVE', 20, canvas.height - 80);
            ctx.fillText('> STATUS: READY', 20, canvas.height - 60);
            ctx.fillText('> PROJECTS: LOADING...', 20, canvas.height - 40);

            // 右下角閃爍光標
            const blink = Math.floor(time * 2) % 2;
            if (blink) {
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(canvas.width - 30, canvas.height - 30, 15, 20);
            }

            // 繪製 Blinky 幽靈（在 Pacman 前面）
            if (blinkyLoaded) {
                // Blinky 位置在 Pacman 前面約 150px
                const blinkyX = pacmanX + 150;
                const blinkyBaseY = canvas.height / 3 + 200;

                // 上下漂浮效果（使用正弦波）
                const floatOffset = Math.sin(time * 3) * 8; // 上下漂浮 8px
                const blinkyY = blinkyBaseY + floatOffset;

                // 繪製 Blinky（大小約 50px）
                const blinkySize = 50;
                ctx.drawImage(blinkyImage, blinkyX, blinkyY - blinkySize / 2, blinkySize, blinkySize);
            }

            // 繪製 Pacman 動畫
            if (pacmanLoaded) {
                // Pacman Y 位置在 email 下方
                const pacmanY = canvas.height / 3 + 200;

                // 選擇動畫幀（循環播放 1.png -> 2.png -> 3.png）
                const frameIndex = Math.floor(time * 10) % 3;
                const currentFrame = pacmanImages[frameIndex];

                // 繪製 Pacman（大小約 50px）
                const pacmanSize = 50;
                ctx.drawImage(currentFrame, pacmanX, pacmanY - pacmanSize / 2, pacmanSize, pacmanSize);
            }

            // 繪製機器人
            const robotX = canvas.width / 2;
            const robotY = canvas.height / 3 + 300;

            // 根據 Pacman 位置決定顯示狀態
            // Pacman 進入畫面 (0 到畫面寬度) 時顯示，離開後關閉
            let isDisplayOn = false;
            let displayProgress = 0;

            if (pacmanX >= 0 && pacmanX <= canvas.width) {
                // Pacman 在畫面中
                isDisplayOn = true;
                // 計算顯示進度 (0-1)，用於淡入淡出
                if (pacmanX < 100) {
                    displayProgress = pacmanX / 100; // 淡入
                } else if (pacmanX > canvas.width - 100) {
                    displayProgress = (canvas.width - pacmanX) / 100; // 淡出
                } else {
                    displayProgress = 1; // 完全顯示
                }
            }

            ctx.save();
            ctx.strokeStyle = '#00ff00';
            ctx.fillStyle = '#00ff00';
            ctx.lineWidth = 3;

            // 機器人身體
            ctx.strokeRect(robotX - 30, robotY, 60, 80);

            // 機器人手臂（會揮手）
            const waveOffset = isDisplayOn ? Math.sin(time * 5) * 10 : 0;

            // 左手臂
            ctx.beginPath();
            ctx.moveTo(robotX - 30, robotY + 20);
            ctx.lineTo(robotX - 50, robotY + 40);
            ctx.stroke();

            // 右手臂（揮手）
            ctx.beginPath();
            ctx.moveTo(robotX + 30, robotY + 20);
            ctx.lineTo(robotX + 50, robotY + 30 + waveOffset);
            ctx.stroke();

            // 機器人腿
            ctx.beginPath();
            ctx.moveTo(robotX - 15, robotY + 80);
            ctx.lineTo(robotX - 15, robotY + 110);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(robotX + 15, robotY + 80);
            ctx.lineTo(robotX + 15, robotY + 110);
            ctx.stroke();

            // 機器人頭部（螢幕）
            const headY = robotY - 50;
            ctx.strokeRect(robotX - 35, headY, 70, 40);

            // 螢幕背景（根據顯示進度調整亮度）
            if (isDisplayOn) {
                const brightness = Math.floor(17 * displayProgress); // 0-17
                ctx.fillStyle = `#00${brightness.toString(16).padStart(2, '0')}00`;
                ctx.fillRect(robotX - 33, headY + 2, 66, 36);
            } else {
                ctx.fillStyle = '#000000';
                ctx.fillRect(robotX - 33, headY + 2, 66, 36);
            }

            // 顯示 "HELLO WORLD" 文字（根據顯示進度淡入淡出）
            if (isDisplayOn && displayProgress > 0.3) {
                const textOpacity = Math.min(1, (displayProgress - 0.3) / 0.3);
                ctx.globalAlpha = textOpacity;
                ctx.fillStyle = '#00ff00';
                ctx.font = 'bold 10px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.fillText('HELLO', robotX, headY + 15);
                ctx.fillText('WORLD', robotX, headY + 27);
                ctx.globalAlpha = 1;
            }

            // 天線
            ctx.beginPath();
            ctx.moveTo(robotX, headY);
            ctx.lineTo(robotX, headY - 10);
            ctx.stroke();

            // 天線球
            ctx.beginPath();
            ctx.arc(robotX, headY - 10, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // 中央互動提示（在機器人腳下方）
            const pulseAlpha = Math.sin(time * 2) * 0.3 + 0.5;
            ctx.globalAlpha = pulseAlpha;
            ctx.fillStyle = '#00ff00';
            ctx.font = '18px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('▼ SCROLL TO EXPLORE ▼', canvas.width / 2, robotY + 140);
            ctx.globalAlpha = 1;
        }

        function drawAssistantScene() {
            const time = Date.now() / 1000;
            const isSmall = canvas.width < 700;

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.09;

            const gridSize = isSmall ? 36 : 50;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            ctx.restore();

            const scanX = (time * 90) % canvas.width;
            ctx.save();
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.22;
            ctx.beginPath();
            ctx.moveTo(scanX, 0);
            ctx.lineTo(scanX, canvas.height);
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.fillStyle = '#00ff00';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ff00';
            ctx.font = isSmall ? '12px monospace' : '14px monospace';
            ctx.textAlign = 'left';
            ctx.fillText('> GUIDE: ONLINE', 20, 32);
            ctx.fillText('> CHANNEL: PORTFOLIO_LINK', 20, 54);
            ctx.restore();

            const chatMargin = isSmall ? 18 : 48;
            const chatWidth = Math.min(canvas.width - chatMargin * 2, isSmall ? canvas.width - chatMargin * 2 : 920);
            const chatHeight = Math.max(isSmall ? 138 : 142, Math.min(isSmall ? 166 : 180, canvas.height * (isSmall ? 0.22 : 0.2)));
            const chatX = (canvas.width - chatWidth) / 2;
            const chatY = canvas.height - chatHeight - chatMargin;
            const imageTop = isSmall ? 24 : 38;
            const availableImageHeight = Math.max(180, chatY - imageTop - 18);
            const imageAspect = assistantLoaded && assistantImage.height ? assistantImage.width / assistantImage.height : 0.853;
            let imageHeight = availableImageHeight;
            let imageWidth = imageHeight * imageAspect;
            const maxImageWidth = canvas.width * (isSmall ? 0.88 : 0.46);

            if (imageWidth > maxImageWidth) {
                imageWidth = maxImageWidth;
                imageHeight = imageWidth / imageAspect;
            }

            const imageX = isSmall
                ? (canvas.width - imageWidth) / 2
                : Math.min(canvas.width * 0.66 - imageWidth / 2, canvas.width - imageWidth - 70);
            const imageY = imageTop + Math.sin(time * 1.5) * 4;

            ctx.save();
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.35;
            ctx.beginPath();
            ctx.moveTo(imageX - 20, imageTop + availableImageHeight + 8);
            ctx.lineTo(imageX + imageWidth + 20, imageTop + availableImageHeight + 8);
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.shadowBlur = 22;
            ctx.shadowColor = 'rgba(0, 255, 0, 0.45)';
            if (assistantLoaded) {
                ctx.drawImage(assistantImage, imageX, imageY, imageWidth, imageHeight);
            } else {
                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.7;
                ctx.strokeRect(imageX, imageY, imageWidth, imageHeight);
                ctx.font = '16px monospace';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#00ff00';
                ctx.fillText('LOADING GUIDE...', imageX + imageWidth / 2, imageY + imageHeight / 2);
            }
            ctx.restore();

            const transitionReveal = Math.max(0, Math.min(1, (assistantScrollOffset / canvas.height - 0.55) / 0.45));
            const timeReveal = assistantPageEnteredAt ? Math.min(1, (Date.now() - assistantPageEnteredAt) / 480) : 0;
            const reveal = Math.max(transitionReveal, timeReveal);

            if (reveal > 0.01) {
                const ease = 1 - Math.pow(1 - reveal, 3);
                const bounce = Math.sin(reveal * Math.PI) * 10;
                const panelY = chatY + (1 - ease) * 46 - bounce;

                ctx.save();
                ctx.globalAlpha = reveal;
                ctx.shadowBlur = 20;
                ctx.shadowColor = 'rgba(0, 255, 0, 0.65)';
                ctx.fillStyle = 'rgba(0, 12, 0, 0.9)';
                drawRoundedRect(chatX, panelY, chatWidth, chatHeight, 8);
                ctx.fill();

                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#00ff00';
                ctx.font = isSmall ? '12px monospace' : '13px monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
                ctx.fillText('AI GUIDE // ONLINE', chatX + 22, panelY + 30);

                ctx.strokeStyle = 'rgba(0, 255, 0, 0.32)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(chatX + 20, panelY + 45);
                ctx.lineTo(chatX + chatWidth - 20, panelY + 45);
                ctx.stroke();

                const fullMessage = '\u4f60\u597d\uff0c\u6b61\u8fce\u4f86\u5230 Pang Jun Ming Portfolio\u3002\u6211\u5728\u9019\u88e1\u5e6b\u4f60\u4ecb\u7d39\u4f5c\u54c1\u548c\u5c08\u6848\u3002';
                const elapsed = assistantPageEnteredAt ? Date.now() - assistantPageEnteredAt : 0;
                const typedLength = assistantPageEnteredAt ? Math.min(fullMessage.length, Math.floor(elapsed / 38)) : 0;
                const cursor = Math.floor(time * 2) % 2 ? '_' : '';
                const visibleMessage = fullMessage.slice(0, typedLength) + (typedLength < fullMessage.length ? cursor : '');

                ctx.fillStyle = '#d8ffd8';
                ctx.font = isSmall ? '15px "Microsoft JhengHei", "Consolas", monospace' : '18px "Microsoft JhengHei", "Consolas", monospace';
                wrapText(visibleMessage, chatX + 24, panelY + 76, chatWidth - 48, isSmall ? 24 : 28, 3);

                const lineY = panelY + chatHeight - 18;
                ctx.globalAlpha = reveal * (0.45 + Math.sin(time * 5) * 0.15);
                ctx.strokeStyle = '#00ff00';
                ctx.beginPath();
                ctx.moveTo(chatX + 24, lineY);
                ctx.lineTo(chatX + chatWidth - 24, lineY);
                ctx.stroke();

                ctx.restore();
            }
        }

        function animate() {
            // 如果正在滾動，增加偏移量
            if (isScrolling && scrollOffset < canvas.height) {
                scrollOffset = Math.min(scrollOffset + 8, canvas.height);
                gifContainer.style.transform = `translate(-50%, -50%) translateY(${scrollOffset}px)`;
            }

            // 檢查是否到達 portfolio 頁面
            if (scrollOffset >= canvas.height && !portfolioReached) {
                portfolioReached = true;
                isScrolling = false;
                gifContainer.style.display = 'none';
            }

            if (assistantScrolling) {
                assistantScrollOffset += assistantScrollDirection * 16;
                assistantScrollOffset = Math.max(0, Math.min(canvas.height, assistantScrollOffset));

                if (assistantScrollOffset >= canvas.height) {
                    assistantScrolling = false;
                    assistantPageReached = true;
                    assistantPageEnteredAt = Date.now();
                } else if (assistantScrollOffset <= 0) {
                    assistantScrolling = false;
                    assistantPageReached = false;
                    assistantPageEnteredAt = null;
                }
            }

            // 更新 Pacman 位置（只在 portfolio 頁面時移動）
            if (portfolioReached && assistantScrollOffset < canvas.height) {
                pacmanX += pacmanSpeed;
                // 如果 Pacman 移出右側，重置到左側
                if (pacmanX > canvas.width + 100) {
                    pacmanX = -100;
                }
            }

            // 繪製黑色背景
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 如果已到達 portfolio，只顯示科幻風格 portfolio
            if (portfolioReached) {
                if (assistantScrollOffset > 0) {
                    ctx.save();
                    ctx.translate(0, -assistantScrollOffset);
                    drawSciFiPortfolio();
                    ctx.restore();

                    ctx.save();
                    ctx.translate(0, canvas.height - assistantScrollOffset);
                    drawAssistantScene();
                    ctx.restore();
                } else {
                    drawSciFiPortfolio();
                }
            } else {
                // 滾動中，繪製內容並偏移
                ctx.save();
                ctx.translate(0, scrollOffset);

                drawSphere();
                drawRope();

                ctx.restore();

                // 繪製上方的科幻風格區域
                if (scrollOffset > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(0, 0, canvas.width, scrollOffset);
                    ctx.clip();
                    drawSciFiPortfolio();
                    ctx.restore();
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
