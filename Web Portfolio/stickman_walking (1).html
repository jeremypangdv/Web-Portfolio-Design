<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑暗中行走</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            background: #000000;
        }

        #gifContainer {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #gifContainer img {
            width: 1000px;
            height: auto;
            display: block;
        }

        #chatOverlay {
            position: fixed;
            left: 50%;
            bottom: 26px;
            z-index: 10;
            width: min(920px, calc(100vw - 36px));
            height: min(230px, 34vh);
            min-height: 190px;
            transform: translate(-50%, 34px);
            opacity: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            border: 2px solid #00ff00;
            border-radius: 8px;
            background: rgba(0, 10, 0, 0.92);
            box-shadow: 0 0 24px rgba(0, 255, 0, 0.42);
            color: #d8ffd8;
            font-family: Consolas, "Courier New", monospace;
            transition: opacity 280ms ease, transform 280ms ease;
            overscroll-behavior: contain;
        }

        #chatOverlay.is-visible {
            transform: translate(-50%, 0);
            opacity: 1;
            pointer-events: auto;
        }

        .chatHeader {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px 9px;
            border-bottom: 1px solid rgba(0, 255, 0, 0.32);
            color: #00ff00;
            font-size: 13px;
            line-height: 1;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        }

        .chatHeaderActions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        #generationStatus {
            display: none;
            color: #00ff00;
            font-size: 11px;
            white-space: nowrap;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.78);
        }

        #generationStatus.is-visible {
            display: inline-block;
        }

        #skipButton {
            display: none;
            width: 56px;
            height: 24px;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 255, 0, 0.76);
            border-radius: 4px;
            background: rgba(0, 30, 0, 0.82);
            color: #00ff00;
            font: bold 11px Consolas, "Courier New", monospace;
            cursor: pointer;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.78);
        }

        #skipButton.is-visible {
            display: inline-flex;
        }

        #skipButton:hover {
            background: rgba(0, 70, 0, 0.9);
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.42);
        }

        #skipButton:disabled {
            cursor: default;
            opacity: 0.55;
        }

        #historyButton {
            position: relative;
            width: 28px;
            height: 24px;
            border: 1px solid rgba(0, 255, 0, 0.7);
            border-radius: 4px;
            background: rgba(0, 30, 0, 0.78);
            cursor: pointer;
            flex: 0 0 auto;
        }

        #historyButton::before {
            content: "";
            position: absolute;
            left: 7px;
            top: 6px;
            width: 12px;
            height: 2px;
            background: #00ff00;
            box-shadow: 0 5px 0 #00ff00, 0 10px 0 #00ff00;
        }

        #historyButton:hover,
        #historyButton.is-active {
            background: rgba(0, 70, 0, 0.86);
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.42);
        }

        #connectionStatus {
            display: none;
            max-width: 48%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: right;
        }

        #chatMessages {
            flex: 1;
            overflow: hidden;
            padding: 12px 16px;
            scrollbar-color: #00ff00 #001900;
            overscroll-behavior: contain;
        }

        #historyPanel {
            position: fixed;
            inset: 0;
            display: none;
            z-index: 30;
            align-items: center;
            justify-content: center;
            padding: 26px;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(2px);
        }

        #historyPanel.is-visible {
            display: flex;
        }

        #historyDialog {
            width: min(820px, calc(100vw - 42px));
            height: min(620px, calc(100vh - 58px));
            min-height: 280px;
            display: flex;
            flex-direction: column;
            border: 2px solid #00ff00;
            border-radius: 8px;
            background: rgba(0, 8, 0, 0.97);
            box-shadow: 0 0 32px rgba(0, 255, 0, 0.45);
            color: #d8ffd8;
            font-family: Consolas, "Courier New", monospace;
        }

        .historyHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 14px 10px 16px;
            border-bottom: 1px solid rgba(0, 255, 0, 0.34);
            color: #00ff00;
            font-size: 13px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        }

        #historyCloseButton {
            width: 30px;
            height: 28px;
            border: 1px solid rgba(0, 255, 0, 0.76);
            border-radius: 4px;
            background: rgba(0, 30, 0, 0.82);
            color: #00ff00;
            font: bold 14px Consolas, "Courier New", monospace;
            cursor: pointer;
        }

        #historyCloseButton:hover {
            background: rgba(0, 70, 0, 0.9);
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.42);
        }

        #historyMessages {
            width: 100%;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 14px 18px;
            scrollbar-color: #00ff00 #001900;
            overscroll-behavior: contain;
        }

        .chatMessage {
            margin-bottom: 8px;
            line-height: 1.35;
            overflow-wrap: anywhere;
            word-break: break-word;
            font-size: 15px;
        }

        .chatMessage.rin {
            color: #d8ffd8;
        }

        .chatMessage.player {
            color: #ffffff;
        }

        .chatSpeaker {
            color: #00ff00;
            margin-right: 6px;
        }

        .chatText {
            white-space: pre-wrap;
        }

        .chatContinueMarker {
            color: #00ff00;
            margin-left: 8px;
            animation: continueBlink 900ms ease-in-out infinite;
        }

        #chatForm {
            display: flex;
            gap: 10px;
            padding: 10px 12px 12px;
            border-top: 1px solid rgba(0, 255, 0, 0.32);
        }

        #playerInput {
            flex: 1;
            min-width: 0;
            height: 40px;
            border: 1px solid rgba(0, 255, 0, 0.72);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.88);
            color: #ffffff;
            padding: 0 12px;
            font: 15px Consolas, "Courier New", monospace;
            outline: none;
        }

        #playerInput:focus {
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.45);
        }

        #sendButton {
            width: 94px;
            height: 40px;
            border: 1px solid #00ff00;
            border-radius: 6px;
            background: #002800;
            color: #00ff00;
            font: bold 14px Consolas, "Courier New", monospace;
            cursor: pointer;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.8);
        }

        #sendButton:disabled,
        #playerInput:disabled {
            cursor: default;
            opacity: 0.55;
        }

        #sendButton.is-denied {
            animation: sendDeniedShake 260ms ease;
            border-color: #ff4040;
            color: #ff6666;
            background: #280000;
            box-shadow: 0 0 14px rgba(255, 64, 64, 0.72);
        }

        @keyframes sendDeniedShake {
            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-6px);
            }

            40% {
                transform: translateX(6px);
            }

            60% {
                transform: translateX(-4px);
            }

            80% {
                transform: translateX(4px);
            }
        }

        @keyframes continueBlink {
            0%,
            100% {
                opacity: 0.25;
            }

            50% {
                opacity: 1;
            }
        }

        @media (max-width: 700px) {
            #chatOverlay {
                bottom: 18px;
                width: calc(100vw - 24px);
                height: 230px;
            }

            .chatHeader {
                font-size: 11px;
            }

            #generationStatus {
                font-size: 10px;
            }

            .chatMessage,
            #playerInput {
                font-size: 14px;
            }

            #sendButton {
                width: 72px;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="gifContainer">
        <img src="/Web%20Portfolio/test.gif" alt="walking animation" onload="console.log('GIF loaded!')" onerror="console.log('GIF failed to load')">
    </div>
    <div id="chatOverlay" aria-hidden="true">
        <div class="chatHeader">
            <span>RIN SAIONJI</span>
            <div class="chatHeaderActions">
                <span id="generationStatus" aria-live="polite"></span>
                <button id="skipButton" type="button" aria-label="Skip Rin dialogue">SKIP</button>
                <button id="historyButton" type="button" aria-label="Chat history"></button>
            </div>
            <span id="connectionStatus" aria-hidden="true"></span>
        </div>
        <div id="chatMessages"></div>
        <form id="chatForm">
            <input id="playerInput" type="text" maxlength="500" autocomplete="off" placeholder="Talk to Rin..." disabled>
            <button id="sendButton" type="submit" disabled>SEND</button>
        </form>
    </div>
    <div id="historyPanel" aria-hidden="true">
        <div id="historyDialog" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
            <div class="historyHeader">
                <span id="historyTitle">CHAT HISTORY</span>
                <button id="historyCloseButton" type="button" aria-label="Close history">X</button>
            </div>
            <div id="historyMessages"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gifContainer = document.getElementById('gifContainer');
        const chatOverlay = document.getElementById('chatOverlay');
        const chatMessagesEl = document.getElementById('chatMessages');
        const generationStatus = document.getElementById('generationStatus');
        const skipButton = document.getElementById('skipButton');
        const historyButton = document.getElementById('historyButton');
        const historyPanel = document.getElementById('historyPanel');
        const historyCloseButton = document.getElementById('historyCloseButton');
        const historyMessagesEl = document.getElementById('historyMessages');
        const chatForm = document.getElementById('chatForm');
        const playerInput = document.getElementById('playerInput');
        const sendButton = document.getElementById('sendButton');
        const connectionStatus = document.getElementById('connectionStatus');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const RIN_INITIAL_MESSAGE = "Hmph. You finally arrived. You look like you need help, that's all. Do not misunderstand.";
        const RIN_DIALOGUE_CHUNK_LIMIT = 145;
        const PRESENCE_PING_INTERVAL_MS = 10000;
        const DISALLOWED_CHAT_PATTERNS = [
            /(?:^|[^\w])(?:18\+|r\s*-?\s*18|18\s*plus|18\s*only|adult|mature)(?=$|[^\w])/i,
            /\b(?:nsfw|porn|pornographic|erotic|lewd|nude|nudity|naked|sex|sexting|sexy|sexual|sexually|fetish|xxx|strip|undress|seduce|horny)\b/i,
            /\bexplicit\b.{0,24}\b(?:sexual|scene|content|image|photo|picture)\b/i,
            /\b(?:sexual|erotic)\b.{0,24}\b(?:scene|content|roleplay|image|photo|picture)\b/i,
            /\b(?:make\s+love|sleep\s+with)\b/i,
            /(?:18\u7981|R18|\u8272\u60c5|\u8272\u8272|\u88f8\u804a|\u88f8\u7167|\u88f8\u9ad4|\u88f8\u4f53|\u9ec4\u8272|\u9ec3\u8272|\u9732\u9aa8|\u6210\u4eba\u5411|\u6210\u4eba\u5185\u5bb9|\u6210\u4eba\u5167\u5bb9|\u6027\u611b|\u6027\u7231|\u6027\u6697\u793a|\u6027\u5185\u5bb9|\u6027\u5167\u5bb9|\u6027\u8bdd\u9898|\u6027\u8a71\u984c|\u505a\u611b|\u505a\u7231)/iu,
            /\b(?:adult content|mature content)\b/i,
        ];
        const SAFETY_REFUSAL_PATTERN = /(?:I cannot create content that is explicit or sexual in nature|(?:cannot|can't|unable to).{0,90}(?:explicit|sexual|erotic|adult|nsfw|pornographic)|(?:explicit|sexual|erotic|adult).{0,90}(?:nature|content|material|request))/i;

        localStorage.removeItem('rin-saionji-portfolio-client-id');
        const rinClientId = `portfolio-${Date.now()}-${Math.random().toString(16).slice(2)}`;

        let rinThinking = false;
        let chatOverlayVisible = false;
        let rinDialogueActive = false;
        let rinDialogueMessageEl = null;
        let rinDialogueChunks = [];
        let rinDialogueIndex = -1;
        let rinDialogueLoggedCount = 0;
        let rinDialogueRunId = 0;
        let rinVoiceLoading = false;
        let rinVoiceAudio = null;
        let rinVoiceSequence = 0;
        let rinVoiceStopResolve = null;
        const rinVoiceRequests = new Map();
        let historyPanelVisible = false;
        const chatHistory = [];

        let sphereVisible = true;
        let ropeEndY = 0;
        let ropeDropping = false;
        const ropeWidth = 4;
        let ropeX = canvas.width / 2 + 60;
        let scrollOffset = 0;
        let isScrolling = false;
        let assistantScrollOffset = 0;
        let assistantScrolling = false;
        let assistantScrollDirection = 0;
        let assistantPageReached = false;
        let assistantPageEnteredAt = null;
        let portfolioReached = false; // 標記是否已到達 portfolio 頁面

        // Pacman 動畫相關
        const pacmanImages = [];
        let pacmanLoaded = false;
        let pacmanX = -100;
        const pacmanSpeed = 3;

        const assistantImage = new Image();
        let assistantLoaded = false;
        assistantImage.onload = () => {
            assistantLoaded = true;
        };
        assistantImage.src = '/Halfbody%20Female%20by%20Sutemo.png';

        const jeremyImage = new Image();
        let jeremyLoaded = false;
        jeremyImage.onload = () => {
            jeremyLoaded = true;
        };
        jeremyImage.src = '/Jeremy.jpeg';

        const doorClosedImage = new Image();
        const doorOpenImage = new Image();
        let doorClosedLoaded = false;
        let doorOpenLoaded = false;
        let doorIsOpen = false;
        let doorBounds = null;
        let doorTransitionActive = false;
        let doorTransitionStartedAt = 0;
        let doorTransitionStartBounds = null;
        let darkDoorPageReached = false;
        let darkPageScrollOffset = 0;
        let darkPageMaxScroll = 0;
        const DOOR_TRANSITION_MS = 1100;

        doorClosedImage.onload = () => {
            doorClosedLoaded = true;
        };
        doorOpenImage.onload = () => {
            doorOpenLoaded = true;
        };
        doorClosedImage.src = '/Door/door_closed.png';
        doorOpenImage.src = '/Door/door_open.png';

        // 載入 Pacman 圖片
        for (let i = 1; i <= 3; i++) {
            const img = new Image();
            img.src = `/Web%20Portfolio/pacman/${i}.png`;
            img.onload = () => {
                if (i === 3) pacmanLoaded = true;
            };
            pacmanImages.push(img);
        }

        // Blinky 幽靈相關
        const blinkyImage = new Image();
        blinkyImage.src = '/Web%20Portfolio/pacman/blinky.png';
        let blinkyLoaded = false;
        blinkyImage.onload = () => {
            blinkyLoaded = true;
        };

        // 獲取當前繩子的抖動偏移
        function getRopeShake() {
            const time = Date.now() / 1000;
            return Math.sin(time * 3) * 2; // 左右抖動 2px
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ropeX = canvas.width / 2 + 60;

            if (portfolioReached) {
                scrollOffset = canvas.height;
            }

            if (assistantPageReached) {
                assistantScrollOffset = canvas.height;
            } else {
                assistantScrollOffset = Math.min(assistantScrollOffset, canvas.height);
            }

            darkPageScrollOffset = Math.min(darkPageScrollOffset, darkPageMaxScroll);
        });

        function clampValue(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function getChatWheelDelta(e, pageHeight = chatMessagesEl.clientHeight || canvas.height) {
            if (e.deltaMode === WheelEvent.DOM_DELTA_LINE) {
                return e.deltaY * 18;
            }

            if (e.deltaMode === WheelEvent.DOM_DELTA_PAGE) {
                return e.deltaY * pageHeight;
            }

            return e.deltaY;
        }

        function getAssistantSceneScreenOffsetY() {
            if (!portfolioReached || assistantScrollOffset <= 0) return null;
            return canvas.height - assistantScrollOffset;
        }

        function isClickInsideAssistantDoor(clientX, clientY) {
            const sceneOffsetY = getAssistantSceneScreenOffsetY();
            if (sceneOffsetY === null || !doorBounds || doorTransitionActive || darkDoorPageReached) return false;

            const sceneX = clientX;
            const sceneY = clientY - sceneOffsetY;
            return sceneX >= doorBounds.x &&
                sceneX <= doorBounds.x + doorBounds.width &&
                sceneY >= doorBounds.y &&
                sceneY <= doorBounds.y + doorBounds.height;
        }

        function startDoorTransition() {
            const sceneOffsetY = getAssistantSceneScreenOffsetY();
            if (sceneOffsetY === null || !doorBounds || doorTransitionActive || darkDoorPageReached) return;

            doorIsOpen = true;
            doorTransitionActive = true;
            doorTransitionStartedAt = performance.now();
            darkPageScrollOffset = 0;
            darkPageMaxScroll = 0;
            doorTransitionStartBounds = {
                x: doorBounds.x,
                y: doorBounds.y + sceneOffsetY,
                width: doorBounds.width,
                height: doorBounds.height,
            };
            rinDialogueRunId += 1;
            rinThinking = false;
            rinDialogueActive = false;
            rinVoiceLoading = false;
            rinDialogueChunks = [];
            rinDialogueIndex = -1;
            rinDialogueMessageEl = null;
            setSkipButtonVisible(false);
            setHistoryPanelVisible(false);
            stopRinVoice();
            chatOverlayVisible = false;
            chatOverlay.classList.remove('is-visible');
            chatOverlay.setAttribute('aria-hidden', 'true');
            setChatBusy(false);
            canvas.style.cursor = 'default';
        }

        chatOverlay.addEventListener('wheel', (e) => {
            if (!chatOverlayVisible) return;

            e.preventDefault();
            e.stopPropagation();
            if (historyPanelVisible) {
                historyMessagesEl.scrollTop += getChatWheelDelta(e);
            }
        }, { passive: false });

        chatOverlay.addEventListener('click', (e) => {
            if (!rinDialogueActive || historyPanelVisible) return;

            e.preventDefault();
            e.stopPropagation();
            advanceRinDialogue();
        });

        skipButton.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            skipRinDialogue();
        });

        historyButton.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            setHistoryPanelVisible(true);
        });

        historyCloseButton.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            setHistoryPanelVisible(false);
        });

        historyPanel.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        historyPanel.addEventListener('wheel', (e) => {
            if (!historyPanelVisible) return;

            e.preventDefault();
            e.stopPropagation();
            historyMessagesEl.scrollTop += getChatWheelDelta(e);
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (!chatOverlayVisible || historyPanelVisible || !rinDialogueActive || e.key.toLowerCase() !== 'e') return;

            e.preventDefault();
            advanceRinDialogue();
        });

        window.addEventListener('wheel', (e) => {
            if (chatOverlayVisible && chatOverlay.contains(e.target)) return;

            if (darkDoorPageReached) {
                e.preventDefault();
                const wheelDelta = getChatWheelDelta(e, canvas.height);
                darkPageScrollOffset = clampValue(darkPageScrollOffset + wheelDelta, 0, darkPageMaxScroll);
                return;
            }

            if (!portfolioReached || isScrolling || assistantScrolling || doorTransitionActive) return;

            if (e.deltaY > 0 && !assistantPageReached) {
                assistantScrolling = true;
                assistantScrollDirection = 1;
                e.preventDefault();
            } else if (e.deltaY < 0 && assistantScrollOffset > 0) {
                assistantScrolling = true;
                assistantScrollDirection = -1;
                e.preventDefault();
            }
        }, { passive: false });

        canvas.addEventListener('click', (e) => {
            if (isClickInsideAssistantDoor(e.clientX, e.clientY)) {
                startDoorTransition();
                return;
            }

            // 點擊球體
            if (sphereVisible) {
                const sphereX = canvas.width - 80;
                const sphereY = 80;
                const sphereRadius = 30;

                const dx = e.clientX - sphereX;
                const dy = e.clientY - sphereY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance <= sphereRadius) {
                    sphereVisible = false;
                    ropeDropping = true;
                    return;
                }
            }

            // 點擊繩子
            if (ropeDropping && !isScrolling) {
                const clickX = e.clientX;
                const clickY = e.clientY;

                if (clickX >= ropeX - 10 && clickX <= ropeX + 10 &&
                    clickY >= 0 && clickY <= ropeEndY) {
                    isScrolling = true;
                }
            }

            // 點擊 email（在 portfolio 頁面）
            if (scrollOffset >= canvas.height && assistantScrollOffset === 0 && !assistantScrolling) {
                const emailY = canvas.height / 3 + 110;
                const emailX = canvas.width / 2;

                // 檢測點擊區域（email 文字範圍）
                if (Math.abs(e.clientX - emailX) < 150 &&
                    Math.abs(e.clientY - emailY) < 15) {
                    window.location.href = 'mailto:junmingpang@outlook.com';
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            canvas.style.cursor = isClickInsideAssistantDoor(e.clientX, e.clientY) ? 'pointer' : 'default';
        });

        function clearChatContinueMarkers() {
            chatMessagesEl.querySelectorAll('.chatContinueMarker').forEach((marker) => marker.remove());
        }

        function addHistoryEntry(speaker, text, type) {
            const entry = { speaker, text, type };
            chatHistory.push(entry);
            renderHistoryPanel();
            return entry;
        }

        function updateHistoryEntry(entry, text) {
            if (!entry) return;
            entry.text = text;
            renderHistoryPanel();
        }

        function removeHistoryEntry(entry) {
            if (!entry) return;

            const index = chatHistory.indexOf(entry);
            if (index >= 0) {
                chatHistory.splice(index, 1);
                renderHistoryPanel();
            }
        }

        function renderHistoryPanel() {
            historyMessagesEl.innerHTML = '';

            chatHistory.forEach((entry) => {
                const messageEl = document.createElement('div');
                messageEl.className = `chatMessage ${entry.type}`;

                const speakerEl = document.createElement('span');
                speakerEl.className = 'chatSpeaker';
                speakerEl.textContent = `${entry.speaker}:`;

                const textEl = document.createElement('span');
                textEl.className = 'chatText';
                textEl.textContent = entry.text;

                messageEl.appendChild(speakerEl);
                messageEl.appendChild(textEl);
                historyMessagesEl.appendChild(messageEl);
            });

            historyMessagesEl.scrollTop = historyMessagesEl.scrollHeight;
        }

        function resetLiveMessages() {
            clearChatContinueMarkers();
            chatMessagesEl.innerHTML = '';
        }

        function setHistoryPanelVisible(isVisible) {
            historyPanelVisible = isVisible;
            historyPanel.classList.toggle('is-visible', isVisible);
            historyPanel.setAttribute('aria-hidden', isVisible ? 'false' : 'true');
            historyButton.classList.toggle('is-active', isVisible);
            renderHistoryPanel();
            setChatBusy(rinThinking);

            if (isVisible) {
                window.setTimeout(() => {
                    historyMessagesEl.scrollTop = historyMessagesEl.scrollHeight;
                    historyCloseButton.focus();
                }, 0);
            } else if (chatOverlayVisible && !rinThinking && !rinDialogueActive) {
                playerInput.focus();
            } else {
                historyButton.focus();
            }
        }

        function setChatMessageText(messageEl, text, hasMore = false) {
            const textEl = messageEl.querySelector('.chatText');
            if (!textEl) return;

            textEl.textContent = text;
            updateHistoryEntry(messageEl.historyEntry, text);

            const oldMarker = messageEl.querySelector('.chatContinueMarker');
            if (oldMarker) {
                oldMarker.remove();
            }

            if (hasMore) {
                const markerEl = document.createElement('span');
                markerEl.className = 'chatContinueMarker';
                markerEl.textContent = '>';
                messageEl.appendChild(markerEl);
            }
        }

        function appendChatMessage(speaker, text, type, options = {}) {
            clearChatContinueMarkers();

            const messageEl = document.createElement('div');
            messageEl.className = `chatMessage ${type}`;
            messageEl.historyEntry = options.log === false ? null : addHistoryEntry(speaker, text, type);

            const speakerEl = document.createElement('span');
            speakerEl.className = 'chatSpeaker';
            speakerEl.textContent = `${speaker}:`;

            const textEl = document.createElement('span');
            textEl.className = 'chatText';
            textEl.textContent = text;

            messageEl.appendChild(speakerEl);
            messageEl.appendChild(textEl);
            if (options.hasMore) {
                const markerEl = document.createElement('span');
                markerEl.className = 'chatContinueMarker';
                markerEl.textContent = '>';
                messageEl.appendChild(markerEl);
            }
            chatMessagesEl.appendChild(messageEl);
            chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
            return messageEl;
        }

        function setChatBusy(isBusy) {
            rinThinking = isBusy;
            const enabled = chatOverlayVisible && !rinThinking && !rinDialogueActive && !historyPanelVisible;
            playerInput.disabled = !enabled;
            sendButton.disabled = !enabled;
            sendButton.textContent = (rinThinking || rinDialogueActive || rinVoiceLoading) ? 'WAIT' : 'SEND';
            skipButton.disabled = !rinDialogueActive;
            updateGenerationStatus();
        }

        function updateGenerationStatus() {
            let statusText = '';
            if (rinThinking) {
                statusText = 'TEXT GENERATING';
            } else if (rinVoiceLoading) {
                statusText = 'VOICE GENERATING';
            }

            generationStatus.textContent = statusText;
            generationStatus.classList.toggle('is-visible', Boolean(statusText));
        }

        function syncChatOverlay() {
            const shouldShow = !darkDoorPageReached && !doorTransitionActive && assistantScrollOffset > canvas.height * 0.82;

            if (shouldShow !== chatOverlayVisible) {
                chatOverlayVisible = shouldShow;
                chatOverlay.classList.toggle('is-visible', shouldShow);

        async function checkOllamaHealth() {
            if (window.location.protocol === 'file:') {
                connectionStatus.textContent = 'SERVER REQUIRED';
                return;
            }

            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                connectionStatus.textContent = data.ok ? `OLLAMA: ${data.model}` : 'OLLAMA: OFFLINE';
            } catch {
                connectionStatus.textContent = 'OLLAMA: OFFLINE';

        function sendPresencePing() {
            if (window.location.protocol === 'file:') return;

            fetch('/api/presence', {
                method: 'POST',
                keepalive: true,
            }).catch(() => {});
        }

        function startPresenceHeartbeat() {
            sendPresencePing();
            window.setInterval(sendPresencePing, PRESENCE_PING_INTERVAL_MS);

            window.addEventListener('pagehide', () => {
                if (window.location.protocol === 'file:') return;

                const payload = JSON.stringify({ clientId: rinClientId });
                const blob = new Blob([payload], { type: 'application/json' });

                if (!navigator.sendBeacon || !navigator.sendBeacon('/api/presence/close', blob)) {
                    fetch('/api/presence/close', {
                        method: 'POST',
                        body: payload,
                        headers: { 'Content-Type': 'application/json' },

                    }).catch(() => {});

        function isDisallowedChatMessage(message) {
            return DISALLOWED_CHAT_PATTERNS.some((pattern) => pattern.test(message));
        }

        function makeBlockedChatError() {
            const error = new Error('blocked');
            error.blocked = true;
            return error;
        }

        function bounceSendButton() {
            sendButton.classList.remove('is-denied');
            void sendButton.offsetWidth;
            sendButton.classList.add('is-denied');
            window.setTimeout(() => {
                sendButton.classList.remove('is-denied');
            }, 280);
        }

        function stopRinVoice() {
            rinVoiceSequence += 1;
            if (rinVoiceStopResolve) {
                const resolveStoppedVoice = rinVoiceStopResolve;
                rinVoiceStopResolve = null;
                resolveStoppedVoice();
            }

            if (!rinVoiceAudio) return;

            rinVoiceAudio.pause();
            rinVoiceAudio.currentTime = 0;
            rinVoiceAudio = null;
        }

        function setSkipButtonVisible(isVisible) {
            skipButton.classList.toggle('is-visible', isVisible);
            skipButton.disabled = !isVisible;
        }

        function wait(ms) {
            return new Promise((resolve) => window.setTimeout(resolve, ms));
        }

        async function loadRinVoiceForText(text) {
            const key = String(text || '').trim();
            if (!key || window.location.protocol === 'file:') {
                return { voiceUrl: null };
            }

            if (rinVoiceRequests.has(key)) {
                return rinVoiceRequests.get(key);
            }

            const request = (async () => {
                const response = await fetch('/api/voice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: key }),
                });
                const data = await response.json();
                return response.ok ? data : { voiceUrl: null };
            })().catch(() => ({ voiceUrl: null }));

            rinVoiceRequests.set(key, request);
            return request;
        }

        function preloadRinVoice(index) {
            const chunk = rinDialogueChunks[index];
            if (!chunk) return;
            loadRinVoiceForText(chunk);
        }

        function playRinVoiceAndWait(voiceUrl, voiceStyle = 'normal') {
            if (!voiceUrl) {
                return wait(900);
            }

            return new Promise((resolve) => {
                const sequence = ++rinVoiceSequence;
                const audio = new Audio(voiceUrl);
                rinVoiceAudio = audio;
                rinVoiceAudio.volume = voiceStyle === 'soft' ? 0.76 : voiceStyle === 'loud' ? 1 : 0.92;

                let settled = false;
                const finish = () => {
                    if (settled) return;
                    settled = true;
                    if (rinVoiceStopResolve === finish) {
                        rinVoiceStopResolve = null;
                    }
                    if (sequence === rinVoiceSequence && rinVoiceAudio === audio) {
                        rinVoiceAudio = null;
                    }
                    resolve();
                };

                rinVoiceStopResolve = finish;
                audio.addEventListener('ended', finish, { once: true });
                audio.addEventListener('error', finish, { once: true });
                audio.play().catch(finish);
            });
        }

        function splitLongDialoguePart(part, maxLength) {
            const phraseParts = part.match(/[^,;:]+[,;:]+["']?|[^,;:]+$/g) || [part];
            const chunks = [];
            let current = '';

            phraseParts.forEach((phrase) => {
                const trimmedPhrase = phrase.trim();
                if (!trimmedPhrase) return;

                const next = current ? `${current} ${trimmedPhrase}` : trimmedPhrase;
                if (next.length <= maxLength || !current) {
                    current = next;
                    return;
                }

                chunks.push(current);
                current = trimmedPhrase;
            });

            if (current) {
                chunks.push(current);
            }

            return chunks;
        }

        function splitRinDialogue(text) {
            const cleaned = String(text || '').replace(/\s+/g, ' ').trim();
            if (!cleaned) return ['...'];

            const parts = cleaned.match(/[^.!?]+[.!?]+["']?|[^.!?]+$/g) || [cleaned];
            const chunks = [];
            let current = '';

            parts.forEach((part) => {
                const sentence = part.trim();
                if (!sentence) return;

                const next = current ? `${current} ${sentence}` : sentence;
                if (next.length > RIN_DIALOGUE_CHUNK_LIMIT && current) {
                    chunks.push(current);
                    current = sentence;
                } else {
                    current = next;
                }
            });

            if (current) {
                if (current.length > RIN_DIALOGUE_CHUNK_LIMIT * 1.55) {
                    chunks.push(...splitLongDialoguePart(current, RIN_DIALOGUE_CHUNK_LIMIT));
                } else {
                    chunks.push(current);
                }
            }

            return chunks.length ? chunks : [cleaned];
        }

        async function showRinDialogueChunk(index, runId) {
            if (runId !== rinDialogueRunId || !rinDialogueActive || !rinDialogueMessageEl) return;
            if (index < 0 || index >= rinDialogueChunks.length) {
                finishRinDialogue(runId);
                return;
            }

            const chunk = rinDialogueChunks[index];
            rinDialogueIndex = index;
            rinVoiceLoading = true;
            setChatMessageText(rinDialogueMessageEl, '...', false);
            setChatBusy(false);

            const voice = await loadRinVoiceForText(chunk);
            if (runId !== rinDialogueRunId || !rinDialogueActive || rinDialogueIndex !== index) return;

            rinVoiceLoading = false;
            const hasMore = index < rinDialogueChunks.length - 1;
            addHistoryEntry('RIN', chunk, 'rin');
            rinDialogueLoggedCount = Math.max(rinDialogueLoggedCount, index + 1);
            setChatMessageText(rinDialogueMessageEl, chunk, hasMore);
            chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
            setChatBusy(false);
            preloadRinVoice(index + 1);

            await playRinVoiceAndWait(voice.voiceUrl, voice.voiceStyle);
            if (runId !== rinDialogueRunId || !rinDialogueActive || rinDialogueIndex !== index) return;

            if (hasMore) {
                showRinDialogueChunk(index + 1, runId);
            } else {
                finishRinDialogue(runId);
            }
        }

        function showRinDialogue(reply, firstMessageEl) {
            const chunks = splitRinDialogue(reply);
            rinDialogueRunId += 1;
            const runId = rinDialogueRunId;

            stopRinVoice();
            rinDialogueChunks = chunks;
            rinDialogueIndex = -1;
            rinDialogueLoggedCount = 0;
            rinDialogueActive = true;
            rinDialogueMessageEl = firstMessageEl;
            rinVoiceLoading = true;
            setSkipButtonVisible(true);
            setChatMessageText(firstMessageEl, '...', false);
            setChatBusy(false);
            showRinDialogueChunk(0, runId);
        }

        function advanceRinDialogue() {
            if (!rinDialogueActive || rinThinking || rinVoiceLoading || !rinDialogueMessageEl) return false;

            const nextIndex = rinDialogueIndex + 1;
            if (nextIndex >= rinDialogueChunks.length) {
                stopRinVoice();
                finishRinDialogue(rinDialogueRunId);
                return true;
            }

            stopRinVoice();
            showRinDialogueChunk(nextIndex, rinDialogueRunId);
            return true;
        }

        function skipRinDialogue() {
            if (!rinDialogueActive || !rinDialogueMessageEl) return false;

            const finalChunk = rinDialogueChunks[rinDialogueChunks.length - 1] || '...';
            rinDialogueRunId += 1;
            stopRinVoice();

            for (let i = rinDialogueLoggedCount; i < rinDialogueChunks.length; i++) {
                addHistoryEntry('RIN', rinDialogueChunks[i], 'rin');
            }
            rinDialogueLoggedCount = rinDialogueChunks.length;

            setChatMessageText(rinDialogueMessageEl, finalChunk, false);
            finishRinDialogue(rinDialogueRunId);
            return true;
        }

        function finishRinDialogue(runId) {
            if (runId !== rinDialogueRunId) return;

            rinDialogueActive = false;
            rinVoiceLoading = false;
            rinDialogueChunks = [];
            rinDialogueIndex = -1;
            rinDialogueLoggedCount = 0;
            rinDialogueMessageEl = null;
            setSkipButtonVisible(false);
            setChatBusy(false);

            if (chatOverlayVisible && !historyPanelVisible) {
                playerInput.focus();
            }
        }

        async function sendMessageToRin(message) {
            if (window.location.protocol === 'file:') {
                throw new Error('Open this portfolio through the local server first.');
            }

            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    clientId: rinClientId,
                    message,
                }),
            });
            const data = await response.json();

            if (data.blocked) {
                throw makeBlockedChatError();
            }

            if (!response.ok) {
                throw new Error(data.reply || data.error || 'Rin could not reply.');
            }

            if (data.model) {
                connectionStatus.textContent = `OLLAMA: ${data.model}`;
            }

            if (SAFETY_REFUSAL_PATTERN.test(data.reply || '')) {
                throw makeBlockedChatError();
            }

            return data.reply;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = playerInput.value.trim();
            if (!message || rinThinking || rinDialogueActive) return;

            if (isDisallowedChatMessage(message)) {
                bounceSendButton();
                playerInput.focus();
                return;
            }

            setHistoryPanelVisible(false);
            resetLiveMessages();
            stopRinVoice();
            playerInput.value = '';
            const playerMessageEl = appendChatMessage('YOU', message, 'player');
            const thinkingEl = appendChatMessage('RIN', '...', 'rin', { log: false });
            setChatBusy(true);

            try {
                const reply = await sendMessageToRin(message);
                if (doorTransitionActive || darkDoorPageReached) return;
                showRinDialogue(reply, thinkingEl);
            } catch (error) {
                if (doorTransitionActive || darkDoorPageReached) return;

                if (error.blocked) {
                    removeHistoryEntry(playerMessageEl.historyEntry);
                    playerMessageEl.remove();
                    thinkingEl.remove();
                    playerInput.value = message;
                    bounceSendButton();
                    return;
                }

                const errorText = `Hmph. ${error.message}`;
                thinkingEl.historyEntry = addHistoryEntry('RIN', errorText, 'rin');
                setChatMessageText(thinkingEl, errorText);
                connectionStatus.textContent = 'OLLAMA: ERROR';
            } finally {
                setChatBusy(false);
                if (chatOverlayVisible && !rinDialogueActive) {
                    playerInput.focus();
                }
            }
        });

        appendChatMessage('RIN', RIN_INITIAL_MESSAGE, 'rin');
        checkOllamaHealth();
        startPresenceHeartbeat();

        function drawRoundedRect(x, y, width, height, radius) {
            const r = Math.min(radius, width / 2, height / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + width - r, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + r);
            ctx.lineTo(x + width, y + height - r);
            ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
            ctx.lineTo(x + r, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function wrapText(text, x, y, maxWidth, lineHeight, maxLines) {
            let line = '';
            let lineCount = 0;

            for (let i = 0; i < text.length; i++) {
                const testLine = line + text[i];

                if (ctx.measureText(testLine).width > maxWidth && line.length > 0) {
                    ctx.fillText(line, x, y);
                    line = text[i];
                    y += lineHeight;
                    lineCount++;

                    if (lineCount >= maxLines - 1) {
                        break;
                    }
                } else {
                    line = testLine;
                }
            }

            if (lineCount < maxLines && line.length > 0) {
                ctx.fillText(line, x, y);
            }
        }

        function drawWrappedWords(text, x, y, maxWidth, lineHeight, maxLines = 99) {
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            const words = String(text || '').split(/\s+/).filter(Boolean);
            let line = '';
            let lines = 0;

            for (const word of words) {
                const testLine = line ? `${line} ${word}` : word;
                if (ctx.measureText(testLine).width > maxWidth && line) {
                    ctx.fillText(line, x, y);
                    y += lineHeight;
                    lines += 1;
                    if (lines >= maxLines) return y;
                    line = word;
                } else {
                    line = testLine;
                }
            }

            if (line && lines < maxLines) {
                ctx.fillText(line, x, y);
                y += lineHeight;
            }

            return y;
        }

        function drawImageCover(image, x, y, width, height) {
            if (!image || !image.width || !image.height) return;

            const sourceAspect = image.width / image.height;
            const targetAspect = width / height;
            let sx = 0;
            let sy = 0;
            let sw = image.width;
            let sh = image.height;

            if (sourceAspect > targetAspect) {
                sw = image.height * targetAspect;
                sx = (image.width - sw) / 2;
            } else {
                sh = image.width / targetAspect;
                sy = Math.min(image.height - sh, Math.max(0, (image.height - sh) * 0.42));
            }

            ctx.drawImage(image, sx, sy, sw, sh, x, y, width, height);
        }

        function drawCvPanel(x, y, width, height, title) {
            ctx.save();
            ctx.shadowBlur = 16;
            ctx.shadowColor = 'rgba(0, 255, 0, 0.24)';
            ctx.fillStyle = 'rgba(0, 10, 0, 0.74)';
            drawRoundedRect(x, y, width, height, 8);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.72)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = '#00ff00';
            ctx.font = 'bold 12px Consolas, "Courier New", monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText(title, x + 14, y + 24);

            ctx.strokeStyle = 'rgba(0, 255, 0, 0.22)';
            ctx.beginPath();
            ctx.moveTo(x + 12, y + 34);
            ctx.lineTo(x + width - 12, y + 34);
            ctx.stroke();
            ctx.restore();
        }

        function drawCvBullet(text, x, y, maxWidth, lineHeight, maxLines = 3) {
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('>', x, y);
            return drawWrappedWords(text, x + 16, y, maxWidth - 16, lineHeight, maxLines);
        }

        function drawSphere() {
            if (!sphereVisible) return;

            const x = canvas.width - 80;
            const y = 80;
            const radius = 30;

            // 繪製球體
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();

            // 繪製點擊提示符號（波紋擴散效果）
            const time = Date.now() / 1000;

            // 繪製在球體正中間
            const iconX = x;
            const iconY = y;

            ctx.save();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 繪製多個波紋，每個波紋間隔一段時間
            for (let i = 0; i < 3; i++) {
                // 每個波紋延遲 1.2 秒，總週期 3.6 秒
                const waveTime = (time * 0.4 + i * 1.2) % 3.6; // 0-3.6 秒循環
                const progress = waveTime / 3.6; // 0-1 的進度

                // 波紋從小到大擴散
                const waveRadius = 5 + progress * 45; // 從 5px 擴散到 50px

                // 大部分時間保持清晰，接近消失時慢慢變透明
                let waveOpacity;
                if (progress < 0.7) {
                    waveOpacity = 1; // 前 70% 保持完全不透明
                } else {
                    waveOpacity = 1 - (progress - 0.7) / 0.3; // 後 30% 慢慢淡出到 0
                }

                if (waveOpacity > 0.01) {
                    ctx.globalAlpha = waveOpacity;
                    ctx.beginPath();
                    ctx.arc(iconX, iconY, waveRadius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            ctx.restore();
        }

        function drawRope() {
            if (!ropeDropping) return;

            // 只有在未點擊時才有抖動效果，點擊後停止抖動
            const shake = isScrolling ? 0 : getRopeShake();

            ctx.fillStyle = 'white';
            ctx.fillRect(ropeX - ropeWidth / 2 + shake, 0, ropeWidth, ropeEndY);

            if (ropeEndY < canvas.height / 2 - 50) {
                ropeEndY += 5;
            }
        }

        function drawSciFiPortfolio() {
            // 黑色背景
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 科幻網格背景效果
            const time = Date.now() / 1000;
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.1;

            // 垂直線
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            // 水平線
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            ctx.globalAlpha = 1;

            // 主標題 - 科幻字體效果
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // 發光效果
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ff00';
            ctx.fillStyle = '#00ff00';
            ctx.font = 'bold 72px Arial';
            ctx.fillText('PANG JUN MING', canvas.width / 2, canvas.height / 3);

            ctx.shadowBlur = 15;
            ctx.font = 'bold 36px Arial';
            ctx.fillText('PORTFOLIO', canvas.width / 2, canvas.height / 3 + 60);

            // Email 文字（可點擊）
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#00ff00';
            ctx.font = '20px Arial';
            const emailText = 'junmingpang@outlook.com';
            const emailY = canvas.height / 3 + 110;
            ctx.fillText(emailText, canvas.width / 2, emailY);

            // 添加下劃線表示可點擊
            const textWidth = ctx.measureText(emailText).width;
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2 - textWidth / 2, emailY + 5);
            ctx.lineTo(canvas.width / 2 + textWidth / 2, emailY + 5);
            ctx.stroke();

            ctx.restore();

            // 繪製動態掃描線
            const scanY = (time * 100) % canvas.height;
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.moveTo(0, scanY);
            ctx.lineTo(canvas.width, scanY);
            ctx.stroke();
            ctx.globalAlpha = 1;

            // 左下角系統信息
            ctx.fillStyle = '#00ff00';
            ctx.font = '14px monospace';
            ctx.textAlign = 'left';
            ctx.fillText('> SYSTEM: ACTIVE', 20, canvas.height - 80);
            ctx.fillText('> STATUS: READY', 20, canvas.height - 60);
            ctx.fillText('> PROJECTS: LOADING...', 20, canvas.height - 40);

            // 右下角閃爍光標
            const blink = Math.floor(time * 2) % 2;
            if (blink) {
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(canvas.width - 30, canvas.height - 30, 15, 20);
            }

            // 繪製 Blinky 幽靈（在 Pacman 前面）
            if (blinkyLoaded) {
                // Blinky 位置在 Pacman 前面約 150px
                const blinkyX = pacmanX + 150;
                const blinkyBaseY = canvas.height / 3 + 200;

                // 上下漂浮效果（使用正弦波）
                const floatOffset = Math.sin(time * 3) * 8; // 上下漂浮 8px
                const blinkyY = blinkyBaseY + floatOffset;

                // 繪製 Blinky（大小約 50px）
                const blinkySize = 50;
                ctx.drawImage(blinkyImage, blinkyX, blinkyY - blinkySize / 2, blinkySize, blinkySize);

        function drawDoorTransitionOverlay() {
            if (!doorTransitionActive || !doorTransitionStartBounds) return;

            const elapsed = performance.now() - doorTransitionStartedAt;
            const progress = Math.min(1, elapsed / DOOR_TRANSITION_MS);
            const ease = progress < 0.5
                ? 4 * progress * progress * progress
                : 1 - Math.pow(-2 * progress + 2, 3) / 2;
            const bounds = doorTransitionStartBounds;
            const targetScale = Math.max(canvas.width / bounds.width, canvas.height / bounds.height) * 1.75;
            const scale = 1 + (targetScale - 1) * ease;
            const centerX = bounds.x + bounds.width / 2;
            const centerY = bounds.y + bounds.height / 2;
            const drawWidth = bounds.width * scale;
            const drawHeight = bounds.height * scale;
            const drawX = centerX - drawWidth / 2;
            const drawY = centerY - drawHeight / 2;

            ctx.save();
            ctx.globalAlpha = Math.min(0.96, progress * 1.1);
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();

            ctx.save();
            ctx.globalAlpha = Math.max(0, 1 - Math.max(0, progress - 0.82) / 0.18);
            ctx.shadowBlur = 36 + ease * 64;
            ctx.shadowColor = 'rgba(0, 255, 100, 0.72)';
            ctx.imageSmoothingEnabled = false;

            if (doorOpenLoaded) {
                ctx.drawImage(doorOpenImage, drawX, drawY, drawWidth, drawHeight);
            } else {
                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 2;
                ctx.strokeRect(drawX, drawY, drawWidth, drawHeight);
            }
            ctx.restore();

            if (progress >= 1) {
                doorTransitionActive = false;
                darkDoorPageReached = true;
                doorTransitionStartBounds = null;
            }
        }

            if (imageWidth > maxImageWidth) {
                imageWidth = maxImageWidth;
                imageHeight = imageWidth / imageAspect;
            }

            const imageX = isSmall
                ? (canvas.width - imageWidth) / 2
                : Math.min(canvas.width * 0.66 - imageWidth / 2, canvas.width - imageWidth - 70);
            const imageY = imageTop + Math.sin(time * 1.5) * 4;

            ctx.save();
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.35;
            ctx.beginPath();
            ctx.moveTo(imageX - 20, imageTop + availableImageHeight + 8);
            ctx.lineTo(imageX + imageWidth + 20, imageTop + availableImageHeight + 8);
            ctx.stroke();
            ctx.restore();

            drawAssistantDoor(isSmall, imageTop, availableImageHeight, chatY, time);

            ctx.save();
            ctx.shadowBlur = 22;
            ctx.shadowColor = 'rgba(0, 255, 0, 0.45)';
            if (assistantLoaded) {
                ctx.drawImage(assistantImage, imageX, imageY, imageWidth, imageHeight);
            } else {
                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.7;
                ctx.strokeRect(imageX, imageY, imageWidth, imageHeight);
                ctx.font = '16px monospace';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#00ff00';
                ctx.fillText('LOADING GUIDE...', imageX + imageWidth / 2, imageY + imageHeight / 2);
            }
            ctx.restore();
        }

        function animate() {
            // 如果正在滾動，增加偏移量
            if (isScrolling && scrollOffset < canvas.height) {
                scrollOffset = Math.min(scrollOffset + 8, canvas.height);
                gifContainer.style.transform = `translate(-50%, -50%) translateY(${scrollOffset}px)`;
            }

            // 檢查是否到達 portfolio 頁面
            if (scrollOffset >= canvas.height && !portfolioReached) {
                portfolioReached = true;
                isScrolling = false;
                gifContainer.style.display = 'none';
            }

            if (assistantScrolling) {
                assistantScrollOffset += assistantScrollDirection * 16;
                assistantScrollOffset = Math.max(0, Math.min(canvas.height, assistantScrollOffset));

                if (assistantScrollOffset >= canvas.height) {
                    assistantScrolling = false;
                    assistantPageReached = true;
                    assistantPageEnteredAt = Date.now();
                } else if (assistantScrollOffset <= 0) {
                    assistantScrolling = false;
                    assistantPageReached = false;
                    assistantPageEnteredAt = null;
                }
            }

            // 更新 Pacman 位置（只在 portfolio 頁面時移動）
            syncChatOverlay();

            if (portfolioReached && assistantScrollOffset < canvas.height) {
                pacmanX += pacmanSpeed;
                // 如果 Pacman 移出右側，重置到左側
                if (pacmanX > canvas.width + 100) {
                    pacmanX = -100;
                }
            }

            // 繪製黑色背景
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 如果已到達 portfolio，只顯示科幻風格 portfolio
            if (darkDoorPageReached) {
                drawDarkDoorPage();
            } else if (portfolioReached) {
                if (assistantScrollOffset > 0) {
                    ctx.save();
                    ctx.translate(0, -assistantScrollOffset);
                    drawSciFiPortfolio();
                    ctx.restore();

                    ctx.save();
                    ctx.translate(0, canvas.height - assistantScrollOffset);
                    drawAssistantScene();
                    ctx.restore();
                } else {
                    drawSciFiPortfolio();
                }
            } else {
                // 滾動中，繪製內容並偏移
                ctx.save();
                ctx.translate(0, scrollOffset);

                drawSphere();
                drawRope();

                ctx.restore();

                // 繪製上方的科幻風格區域
                if (scrollOffset > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(0, 0, canvas.width, scrollOffset);
                    ctx.clip();
                    drawSciFiPortfolio();
                    ctx.restore();
                }
            }

            drawDoorTransitionOverlay();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
