<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑暗中行走</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: Arial, sans-serif;
        }

        [hidden] {
            display: none !important;
        }

        canvas {
            display: block;
            background: #000000;
        }

        #gifContainer {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #gifContainer img {
            width: 1000px;
            height: auto;
            display: block;
        }

        #siteNav {
            position: fixed;
            top: 20px;
            left: 50%;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 16px;
            transform: translateX(-50%);
            color: rgba(216, 255, 216, 0.56);
            font: 16px Consolas, "Courier New", monospace;
            letter-spacing: 0;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.55);
        }

        #siteNav button {
            min-width: 94px;
            padding: 6px 2px;
            border: 0;
            border-bottom: 1px solid transparent;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
            transition: color 160ms ease, border-color 160ms ease, text-shadow 160ms ease;
        }

        #siteNav button:hover,
        #siteNav button.is-active {
            border-bottom-color: #00ff00;
            color: #d8ffd8;
            text-shadow: 0 0 12px rgba(0, 255, 0, 0.9);
        }

        .siteNavDivider {
            color: rgba(0, 255, 0, 0.62);
        }

        #chatOverlay {
            position: fixed;
            left: 50%;
            bottom: 26px;
            z-index: 10;
            width: min(920px, calc(100vw - 36px));
            height: min(230px, 34vh);
            min-height: 190px;
            transform: translate(-50%, 34px);
            opacity: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            border: 2px solid #00ff00;
            border-radius: 8px;
            background: rgba(0, 10, 0, 0.92);
            box-shadow: 0 0 24px rgba(0, 255, 0, 0.42);
            color: #d8ffd8;
            font-family: Consolas, "Courier New", monospace;
            transition: opacity 280ms ease, transform 280ms ease;
            overscroll-behavior: contain;
        }

        #chatOverlay.is-visible {
            transform: translate(-50%, 0);
            opacity: 1;
            pointer-events: auto;
        }

        .chatHeader {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px 9px;
            border-bottom: 1px solid rgba(0, 255, 0, 0.32);
            color: #00ff00;
            font-size: 13px;
            line-height: 1;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        }

        .chatHeaderActions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        #generationStatus {
            display: none;
            color: #00ff00;
            font-size: 11px;
            white-space: nowrap;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.78);
        }

        #generationStatus.is-visible {
            display: inline-block;
        }

        #skipButton {
            display: none;
            width: 56px;
            height: 24px;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 255, 0, 0.76);
            border-radius: 4px;
            background: rgba(0, 30, 0, 0.82);
            color: #00ff00;
            font: bold 11px Consolas, "Courier New", monospace;
            cursor: pointer;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.78);
        }

        #skipButton.is-visible {
            display: inline-flex;
        }

        #skipButton:hover {
            background: rgba(0, 70, 0, 0.9);
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.42);
        }

        #skipButton:disabled {
            cursor: default;
            opacity: 0.55;
        }

        #historyButton {
            position: relative;
            width: 28px;
            height: 24px;
            border: 1px solid rgba(0, 255, 0, 0.7);
            border-radius: 4px;
            background: rgba(0, 30, 0, 0.78);
            cursor: pointer;
            flex: 0 0 auto;
        }

        #historyButton::before {
            content: "";
            position: absolute;
            left: 7px;
            top: 6px;
            width: 12px;
            height: 2px;
            background: #00ff00;
            box-shadow: 0 5px 0 #00ff00, 0 10px 0 #00ff00;
        }

        #historyButton:hover,
        #historyButton.is-active {
            background: rgba(0, 70, 0, 0.86);
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.42);
        }

        #connectionStatus {
            display: none;
            max-width: 48%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: right;
        }

        #chatMessages {
            flex: 1;
            overflow: hidden;
            padding: 12px 16px;
            scrollbar-color: #00ff00 #001900;
            overscroll-behavior: contain;
        }

        #historyPanel {
            position: fixed;
            inset: 0;
            display: none;
            z-index: 30;
            align-items: center;
            justify-content: center;
            padding: 26px;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(2px);
        }

        #historyPanel.is-visible {
            display: flex;
        }

        #historyDialog {
            width: min(820px, calc(100vw - 42px));
            height: min(620px, calc(100vh - 58px));
            min-height: 280px;
            display: flex;
            flex-direction: column;
            border: 2px solid #00ff00;
            border-radius: 8px;
            background: rgba(0, 8, 0, 0.97);
            box-shadow: 0 0 32px rgba(0, 255, 0, 0.45);
            color: #d8ffd8;
            font-family: Consolas, "Courier New", monospace;
        }

        .historyHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 14px 10px 16px;
            border-bottom: 1px solid rgba(0, 255, 0, 0.34);
            color: #00ff00;
            font-size: 13px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        }

        #historyCloseButton {
            width: 30px;
            height: 28px;
            border: 1px solid rgba(0, 255, 0, 0.76);
            border-radius: 4px;
            background: rgba(0, 30, 0, 0.82);
            color: #00ff00;
            font: bold 14px Consolas, "Courier New", monospace;
            cursor: pointer;
        }

        #historyCloseButton:hover {
            background: rgba(0, 70, 0, 0.9);
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.42);
        }

        #historyMessages {
            width: 100%;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 14px 18px;
            scrollbar-color: #00ff00 #001900;
            overscroll-behavior: contain;
        }

        .chatMessage {
            margin-bottom: 8px;
            line-height: 1.35;
            overflow-wrap: anywhere;
            word-break: break-word;
            font-size: 15px;
        }

        .chatMessage.rin {
            color: #d8ffd8;
        }

        .chatMessage.player {
            color: #ffffff;
        }

        .chatSpeaker {
            color: #00ff00;
            margin-right: 6px;
        }

        .chatText {
            white-space: pre-wrap;
        }

        .chatContinueMarker {
            color: #00ff00;
            margin-left: 8px;
            animation: continueBlink 900ms ease-in-out infinite;
        }

        #chatForm {
            display: flex;
            gap: 10px;
            padding: 10px 12px 12px;
            border-top: 1px solid rgba(0, 255, 0, 0.32);
        }

        #playerInput {
            flex: 1;
            min-width: 0;
            height: 40px;
            border: 1px solid rgba(0, 255, 0, 0.72);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.88);
            color: #ffffff;
            padding: 0 12px;
            font: 15px Consolas, "Courier New", monospace;
            outline: none;
        }

        #playerInput:focus {
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.45);
        }

        #sendButton {
            width: 94px;
            height: 40px;
            border: 1px solid #00ff00;
            border-radius: 6px;
            background: #002800;
            color: #00ff00;
            font: bold 14px Consolas, "Courier New", monospace;
            cursor: pointer;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.8);
        }

        #sendButton:disabled,
        #playerInput:disabled {
            cursor: default;
            opacity: 0.55;
        }

        #sendButton.is-denied {
            animation: sendDeniedShake 260ms ease;
            border-color: #ff4040;
            color: #ff6666;
            background: #280000;
            box-shadow: 0 0 14px rgba(255, 64, 64, 0.72);
        }

        @keyframes sendDeniedShake {
            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-6px);
            }

            40% {
                transform: translateX(6px);
            }

            60% {
                transform: translateX(-4px);
            }

            80% {
                transform: translateX(4px);
            }
        }

        @keyframes continueBlink {
            0%,
            100% {
                opacity: 0.25;
            }

            50% {
                opacity: 1;
            }
        }

        @media (max-width: 700px) {
            #siteNav {
                top: 14px;
                gap: 10px;
                font-size: 13px;
            }

            #siteNav button {
                min-width: 76px;
            }

            #chatOverlay {
                bottom: 18px;
                width: calc(100vw - 24px);
                height: 230px;
            }

            .chatHeader {
                font-size: 11px;
            }

            #generationStatus {
                font-size: 10px;
            }

            .chatMessage,
            #playerInput {
                font-size: 14px;
            }

            #sendButton {
                width: 72px;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="gifContainer">
        <img src="test.gif" alt="walking animation" onload="console.log('GIF loaded!')" onerror="console.log('GIF failed to load')">
    </div>
    <nav id="siteNav" aria-label="Primary navigation">
        <button id="homeNavButton" class="is-active" type="button">HOME</button>
        <span class="siteNavDivider" aria-hidden="true">//</span>
        <button id="portfolioNavButton" type="button">PORTFOLIO</button>
    </nav>
    <div id="chatOverlay" aria-hidden="true" hidden>
        <div class="chatHeader">
            <span>RIN SAIONJI</span>
            <div class="chatHeaderActions">
                <span id="generationStatus" aria-live="polite"></span>
                <button id="skipButton" type="button" aria-label="Skip Rin dialogue">SKIP</button>
                <button id="historyButton" type="button" aria-label="Chat history"></button>
            </div>
            <span id="connectionStatus" aria-hidden="true"></span>
        </div>
        <div id="chatMessages"></div>
        <form id="chatForm">
            <input id="playerInput" type="text" maxlength="500" autocomplete="off" placeholder="Talk to Rin..." disabled>
            <button id="sendButton" type="submit" disabled>SEND</button>
        </form>
    </div>
    <div id="historyPanel" aria-hidden="true" hidden>
        <div id="historyDialog" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
            <div class="historyHeader">
                <span id="historyTitle">CHAT HISTORY</span>
                <button id="historyCloseButton" type="button" aria-label="Close history">X</button>
            </div>
            <div id="historyMessages"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gifContainer = document.getElementById('gifContainer');
        const chatOverlay = document.getElementById('chatOverlay');
        const chatMessagesEl = document.getElementById('chatMessages');
        const generationStatus = document.getElementById('generationStatus');
        const skipButton = document.getElementById('skipButton');
        const historyButton = document.getElementById('historyButton');
        const historyPanel = document.getElementById('historyPanel');
        const historyCloseButton = document.getElementById('historyCloseButton');
        const historyMessagesEl = document.getElementById('historyMessages');
        const chatForm = document.getElementById('chatForm');
        const playerInput = document.getElementById('playerInput');
        const sendButton = document.getElementById('sendButton');
        const connectionStatus = document.getElementById('connectionStatus');
        const homeNavButton = document.getElementById('homeNavButton');
        const portfolioNavButton = document.getElementById('portfolioNavButton');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const AI_CHAT_ENABLED = false;
        const RIN_INITIAL_MESSAGE = "Hmph. You finally arrived. You look like you need help, that's all. Do not misunderstand.";
        const RIN_DIALOGUE_CHUNK_LIMIT = 145;
        const PRESENCE_PING_INTERVAL_MS = 10000;
        const DISALLOWED_CHAT_PATTERNS = [
            /(?:^|[^\w])(?:18\+|r\s*-?\s*18|18\s*plus|18\s*only|adult|mature)(?=$|[^\w])/i,
            /\b(?:nsfw|porn|pornographic|erotic|lewd|nude|nudity|naked|sex|sexting|sexy|sexual|sexually|fetish|xxx|strip|undress|seduce|horny)\b/i,
            /\bexplicit\b.{0,24}\b(?:sexual|scene|content|image|photo|picture)\b/i,
            /\b(?:sexual|erotic)\b.{0,24}\b(?:scene|content|roleplay|image|photo|picture)\b/i,
            /\b(?:make\s+love|sleep\s+with)\b/i,
            /(?:18\u7981|R18|\u8272\u60c5|\u8272\u8272|\u88f8\u804a|\u88f8\u7167|\u88f8\u9ad4|\u88f8\u4f53|\u9ec4\u8272|\u9ec3\u8272|\u9732\u9aa8|\u6210\u4eba\u5411|\u6210\u4eba\u5185\u5bb9|\u6210\u4eba\u5167\u5bb9|\u6027\u611b|\u6027\u7231|\u6027\u6697\u793a|\u6027\u5185\u5bb9|\u6027\u5167\u5bb9|\u6027\u8bdd\u9898|\u6027\u8a71\u984c|\u505a\u611b|\u505a\u7231)/iu,
            /\b(?:adult content|mature content)\b/i,
        ];
        const SAFETY_REFUSAL_PATTERN = /(?:I cannot create content that is explicit or sexual in nature|(?:cannot|can't|unable to).{0,90}(?:explicit|sexual|erotic|adult|nsfw|pornographic)|(?:explicit|sexual|erotic|adult).{0,90}(?:nature|content|material|request))/i;

        localStorage.removeItem('rin-saionji-portfolio-client-id');
        const rinClientId = `portfolio-${Date.now()}-${Math.random().toString(16).slice(2)}`;

        let rinThinking = false;
        let chatOverlayVisible = false;
        let rinDialogueActive = false;
        let rinDialogueMessageEl = null;
        let rinDialogueChunks = [];
        let rinDialogueIndex = -1;
        let rinDialogueLoggedCount = 0;
        let rinDialogueRunId = 0;
        let rinVoiceLoading = false;
        let rinVoiceAudio = null;
        let rinVoiceSequence = 0;
        let rinVoiceStopResolve = null;
        const rinVoiceRequests = new Map();
        let historyPanelVisible = false;
        const chatHistory = [];

        let sphereVisible = true;
        let ropeEndY = 0;
        let ropeDropping = false;
        let ropeHoverActive = false;
        let ropeHoverPoint = { x: 0, y: 0 };
        let sphereHoverActive = false;
        let sphereHoverPoint = { x: 0, y: 0 };
        let returnOrbHoverActive = false;
        let returnOrbHoverPoint = { x: 0, y: 0 };
        const ropeWidth = 4;
        let ropeX = canvas.width / 2 + 60;
        let scrollOffset = 0;
        let isScrolling = false;
        let assistantScrollOffset = 0;
        let assistantScrolling = false;
        let assistantScrollDirection = 0;
        let assistantPageReached = false;
        let assistantPageEnteredAt = null;
        let portfolioReached = false; // 標記是否已到達 portfolio 頁面

        // Pacman 動畫相關
        const pacmanImages = [];
        let pacmanLoaded = false;
        let pacmanX = -100;
        const pacmanSpeed = 3;

        let assistantLoaded = false;

        const doorClosedImage = new Image();
        const doorOpenImage = new Image();
        let doorClosedLoaded = false;
        let doorOpenLoaded = false;
        let doorIsOpen = false;
        let doorBounds = null;
        let doorTransitionActive = false;
        let doorTransitionStartedAt = 0;
        let doorTransitionStartBounds = null;
        let darkDoorPageReached = false;
        let darkPageScrollOffset = 0;
        let darkPageMaxScroll = 0;
        const DOOR_TRANSITION_MS = 1100;
        let portfolioReturnTransitionActive = false;
        let portfolioReturnTransitionStartedAt = 0;
        let portfolioReturnResetApplied = false;
        const PORTFOLIO_RETURN_TRANSITION_MS = 1050;

        doorClosedImage.onload = () => {
            doorClosedLoaded = true;
        };
        doorOpenImage.onload = () => {
            doorOpenLoaded = true;
        };
        doorClosedImage.src = 'Door/door_closed.png';
        doorOpenImage.src = 'Door/door_open.png';

        const portfolioProjects = [
            {
                title: 'RIN AI CHAT GAME',
                imagePath: 'portfolio%20png/AI%20Chat.png',
                tools: 'HTML  |  JAVASCRIPT  |  OLLAMA  |  LLAMA 3.1  |  GPT-SOVITS',
                overview: 'A character chat game centred on Rin Saionji, where the player can start a visual-novel-style conversation by typing their own messages.',
                description: 'Rin responds with on-screen dialogue and matching Japanese voice playback. Longer replies appear in readable dialogue segments, while the player can continue, skip, or open the conversation history at any time.',
            },
            {
                title: 'DYNAMIC NPC RESPONSE SYSTEM',
                imagePath: 'portfolio%20png/Dynamic%20NPC%20Response%20System.png',
                tools: 'UNITY 6  |  C#  |  OLLAMA  |  PYTHON  |  FLASK REST API',
                overview: 'A 2D non-linear story prototype where players explore the game world and speak with NPCs to discover clues and progress through the story.',
                description: 'Players can select dialogue prompts or ask their own questions. NPCs react in character, provide hints, and guide the player toward the next event while keeping each conversation flexible.',
            },
            {
                title: 'FLAPPY STRIKE',
                imagePath: 'portfolio%20png/Flappy%20Strike.png',
                tools: 'UNITY 6  |  C#  |  INPUT SYSTEM  |  2D  |  TIMELINE',
                overview: 'A fast 2D flappy-style action game that combines obstacle navigation with aerial shooting.',
                description: 'The player keeps the bird in the air, aims with the mouse, and fires at approaching enemies while avoiding obstacles. Enemy waves build toward a boss encounter that tests movement and timing.',
            },
            {
                title: 'INTERACTIVE PORTFOLIO WEBSITE',
                imagePath: 'portfolio%20png/Interactive%20Portfolio%20Website.png',
                tools: 'HTML  |  CSS  |  JAVASCRIPT  |  CANVAS',
                overview: 'A personal portfolio website presented as an interactive neon archive instead of a static resume page.',
                description: 'Visitors move through animated scenes, pixel-style elements, and clickable transitions before reaching the project archive. Each project image can be opened to reveal a short introduction to the experience.',
            },
            {
                title: 'TETRIS RUN!!!',
                imagePath: 'portfolio%20png/Tetris%20RUN%21%21%21.png',
                tools: 'UNITY  |  C#  |  2D  |  CO-OP MULTIPLAYER',
                overview: 'A cooperative two-player survival game that combines falling blocks with steadily rising lava.',
                description: 'Two players host or join a session, then work together under pressure as falling blocks and rising lava reshape the play space. Survival depends on quick decisions, coordination, and helping each other stay in the game.',
            },
        ];
        let selectedPortfolioProjectIndex = -1;
        let portfolioProjectDetailsVisible = false;
        let portfolioProjectDetailsAnimationStartedAt = 0;
        let portfolioProjectCards = [];
        const PORTFOLIO_ITCH_IO_URL = 'https://jeremydv.itch.io/';
        let portfolioItchLinkBounds = null;

        portfolioProjects.forEach((project) => {
            project.image = new Image();
            project.loaded = false;
            project.image.onload = () => {
                project.loaded = true;
            };
            project.image.src = project.imagePath;
        });

        // 載入 Pacman 圖片
        for (let i = 1; i <= 3; i++) {
            const img = new Image();
            img.src = `pacman/${i}.png`;
            img.onload = () => {
                if (i === 3) pacmanLoaded = true;
            };
            pacmanImages.push(img);
        }

        // Blinky 幽靈相關
        const blinkyImage = new Image();
        blinkyImage.src = 'pacman/blinky.png';
        let blinkyLoaded = false;
        blinkyImage.onload = () => {
            blinkyLoaded = true;
        };

        // 獲取當前繩子的抖動偏移
        function getRopeShake() {
            const time = Date.now() / 1000;
            return Math.sin(time * 3) * 2; // 左右抖動 2px
        }

        function isPointerOverRope(clientX, clientY) {
            if (!ropeDropping || isScrolling || portfolioReached || darkDoorPageReached) return false;

            const ropeScreenX = ropeX + getRopeShake();
            return Math.abs(clientX - ropeScreenX) <= 16 &&
                clientY >= 0 &&
                clientY <= ropeEndY + 12;
        }

        function isPointerOverOpeningSphere(clientX, clientY) {
            if (!sphereVisible || portfolioReached || darkDoorPageReached || scrollOffset > 0) return false;

            const sphereX = canvas.width - 80;
            const sphereY = 80;
            return Math.hypot(clientX - sphereX, clientY - sphereY) <= 38;
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ropeX = canvas.width / 2 + 60;

            if (portfolioReached) {
                scrollOffset = canvas.height;
            }

            if (assistantPageReached) {
                assistantScrollOffset = canvas.height;
            } else {
                assistantScrollOffset = Math.min(assistantScrollOffset, canvas.height);
            }

            darkPageScrollOffset = Math.min(darkPageScrollOffset, darkPageMaxScroll);
        });

        function clampValue(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function getChatWheelDelta(e, pageHeight = chatMessagesEl.clientHeight || canvas.height) {
            if (e.deltaMode === WheelEvent.DOM_DELTA_LINE) {
                return e.deltaY * 18;
            }

            if (e.deltaMode === WheelEvent.DOM_DELTA_PAGE) {
                return e.deltaY * pageHeight;
            }

            return e.deltaY;
        }

        function getAssistantSceneScreenOffsetY() {
            if (!portfolioReached || assistantScrollOffset <= 0) return null;
            return canvas.height - assistantScrollOffset;
        }

        function isClickInsideAssistantDoor(clientX, clientY) {
            const sceneOffsetY = getAssistantSceneScreenOffsetY();
            if (sceneOffsetY === null || !doorBounds || doorTransitionActive || darkDoorPageReached) return false;

            const sceneX = clientX;
            const sceneY = clientY - sceneOffsetY;
            return sceneX >= doorBounds.x &&
                sceneX <= doorBounds.x + doorBounds.width &&
                sceneY >= doorBounds.y &&
                sceneY <= doorBounds.y + doorBounds.height;
        }

        function startDoorTransition() {
            const sceneOffsetY = getAssistantSceneScreenOffsetY();
            if (sceneOffsetY === null || !doorBounds || doorTransitionActive || darkDoorPageReached) return;

            doorIsOpen = true;
            doorTransitionActive = true;
            doorTransitionStartedAt = performance.now();
            darkPageScrollOffset = 0;
            darkPageMaxScroll = 0;
            doorTransitionStartBounds = {
                x: doorBounds.x,
                y: doorBounds.y + sceneOffsetY,
                width: doorBounds.width,
                height: doorBounds.height,
            };
            rinDialogueRunId += 1;
            rinThinking = false;
            rinDialogueActive = false;
            rinVoiceLoading = false;
            rinDialogueChunks = [];
            rinDialogueIndex = -1;
            rinDialogueMessageEl = null;
            setSkipButtonVisible(false);
            setHistoryPanelVisible(false);
            stopRinVoice();
            chatOverlayVisible = false;
            chatOverlay.classList.remove('is-visible');
            chatOverlay.setAttribute('aria-hidden', 'true');
            setChatBusy(false);
            canvas.style.cursor = 'default';
        }

        chatOverlay.addEventListener('wheel', (e) => {
            if (!chatOverlayVisible) return;

            e.preventDefault();
            e.stopPropagation();
            if (historyPanelVisible) {
                historyMessagesEl.scrollTop += getChatWheelDelta(e);
            }

        function stopRinVoice() {
            rinVoiceSequence += 1;
            if (rinVoiceStopResolve) {
                const resolveStoppedVoice = rinVoiceStopResolve;
                rinVoiceStopResolve = null;
                resolveStoppedVoice();
            }

            if (!rinVoiceAudio) return;

        function wait(ms) {

        }

        async function loadRinVoiceForText(text) {
            const key = String(text || '').trim();
            if (!key || window.location.protocol === 'file:') {
                return { voiceUrl: null };
            }

            if (rinVoiceRequests.has(key)) {
                return rinVoiceRequests.get(key);
            }

            const request = (async () => {
                const response = await fetch('/api/voice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: key }),
                });
                const data = await response.json();
                return response.ok ? data : { voiceUrl: null };
            })().catch(() => ({ voiceUrl: null }));

            rinVoiceRequests.set(key, request);
            return request;
        }

        function preloadRinVoice(index) {
            const chunk = rinDialogueChunks[index];
            if (!chunk) return;
            loadRinVoiceForText(chunk);
        }

        function playRinVoiceAndWait(voiceUrl, voiceStyle = 'normal') {
            if (!voiceUrl) {
                return wait(900);
            }

            return new Promise((resolve) => {
                const sequence = ++rinVoiceSequence;
                const audio = new Audio(voiceUrl);
                rinVoiceAudio = audio;
                rinVoiceAudio.volume = voiceStyle === 'soft' ? 0.76 : voiceStyle === 'loud' ? 1 : 0.92;

                let settled = false;
                const finish = () => {
                    if (settled) return;
                    settled = true;
                    if (rinVoiceStopResolve === finish) {
                        rinVoiceStopResolve = null;
                    }
                    if (sequence === rinVoiceSequence && rinVoiceAudio === audio) {
                        rinVoiceAudio = null;
                    }
                    resolve();
                };

                rinVoiceStopResolve = finish;
                audio.addEventListener('ended', finish, { once: true });
                audio.addEventListener('error', finish, { once: true });
                audio.play().catch(finish);
            });
        }

        function splitLongDialoguePart(part, maxLength) {
            const phraseParts = part.match(/[^,;:]+[,;:]+["']?|[^,;:]+$/g) || [part];
            const chunks = [];
            let current = '';

            phraseParts.forEach((phrase) => {
                const trimmedPhrase = phrase.trim();
                if (!trimmedPhrase) return;

                const next = current ? `${current} ${trimmedPhrase}` : trimmedPhrase;
                if (next.length <= maxLength || !current) {
                    current = next;
                    return;
                }

                chunks.push(current);
                current = trimmedPhrase;
            });

            if (current) {
                chunks.push(current);
            }

            return chunks;
        }

        function splitRinDialogue(text) {
            const cleaned = String(text || '').replace(/\s+/g, ' ').trim();
            if (!cleaned) return ['...'];

            const parts = cleaned.match(/[^.!?]+[.!?]+["']?|[^.!?]+$/g) || [cleaned];
            const chunks = [];
            let current = '';

            parts.forEach((part) => {
                const sentence = part.trim();
                if (!sentence) return;

                const next = current ? `${current} ${sentence}` : sentence;
                if (next.length > RIN_DIALOGUE_CHUNK_LIMIT && current) {
                    chunks.push(current);
                    current = sentence;
                } else {
                    current = next;
                }
            });

            if (current) {
                if (current.length > RIN_DIALOGUE_CHUNK_LIMIT * 1.55) {
                    chunks.push(...splitLongDialoguePart(current, RIN_DIALOGUE_CHUNK_LIMIT));
                } else {
                    chunks.push(current);
                }
            }

            return chunks.length ? chunks : [cleaned];
        }

        async function showRinDialogueChunk(index, runId) {
            if (runId !== rinDialogueRunId || !rinDialogueActive || !rinDialogueMessageEl) return;
            if (index < 0 || index >= rinDialogueChunks.length) {
                finishRinDialogue(runId);
                return;
            }

            const chunk = rinDialogueChunks[index];
            rinDialogueIndex = index;
            rinVoiceLoading = true;
            setChatMessageText(rinDialogueMessageEl, '...', false);
            setChatBusy(false);

            const voice = await loadRinVoiceForText(chunk);
            if (runId !== rinDialogueRunId || !rinDialogueActive || rinDialogueIndex !== index) return;

            rinVoiceLoading = false;
            const hasMore = index < rinDialogueChunks.length - 1;
            addHistoryEntry('RIN', chunk, 'rin');
            rinDialogueLoggedCount = Math.max(rinDialogueLoggedCount, index + 1);
            setChatMessageText(rinDialogueMessageEl, chunk, hasMore);
            chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
            setChatBusy(false);
            preloadRinVoice(index + 1);

            await playRinVoiceAndWait(voice.voiceUrl, voice.voiceStyle);
            if (runId !== rinDialogueRunId || !rinDialogueActive || rinDialogueIndex !== index) return;

            if (hasMore) {
                showRinDialogueChunk(index + 1, runId);
            } else {
                finishRinDialogue(runId);
            }
        }

        function showRinDialogue(reply, firstMessageEl) {
            const chunks = splitRinDialogue(reply);
            rinDialogueRunId += 1;
            const runId = rinDialogueRunId;

            stopRinVoice();
            rinDialogueChunks = chunks;
            rinDialogueIndex = -1;
            rinDialogueLoggedCount = 0;
            rinDialogueActive = true;
            rinDialogueMessageEl = firstMessageEl;
            rinVoiceLoading = true;
            setSkipButtonVisible(true);
            setChatMessageText(firstMessageEl, '...', false);
            setChatBusy(false);
            showRinDialogueChunk(0, runId);
        }

        function advanceRinDialogue() {
            if (!rinDialogueActive || rinThinking || rinVoiceLoading || !rinDialogueMessageEl) return false;

            const nextIndex = rinDialogueIndex + 1;
            if (nextIndex >= rinDialogueChunks.length) {
                stopRinVoice();
                finishRinDialogue(rinDialogueRunId);
                return true;
            }

            stopRinVoice();
            showRinDialogueChunk(nextIndex, rinDialogueRunId);
            return true;
        }

        function skipRinDialogue() {
            if (!rinDialogueActive || !rinDialogueMessageEl) return false;

            const finalChunk = rinDialogueChunks[rinDialogueChunks.length - 1] || '...';
            rinDialogueRunId += 1;
            stopRinVoice();

            for (let i = rinDialogueLoggedCount; i < rinDialogueChunks.length; i++) {
                addHistoryEntry('RIN', rinDialogueChunks[i], 'rin');
            }
            rinDialogueLoggedCount = rinDialogueChunks.length;

            setChatMessageText(rinDialogueMessageEl, finalChunk, false);
            finishRinDialogue(rinDialogueRunId);
            return true;
        }

        function finishRinDialogue(runId) {
            if (runId !== rinDialogueRunId) return;

            rinDialogueActive = false;
            rinVoiceLoading = false;
            rinDialogueChunks = [];
            rinDialogueIndex = -1;
            rinDialogueLoggedCount = 0;
            rinDialogueMessageEl = null;
            setSkipButtonVisible(false);
            setChatBusy(false);

            if (chatOverlayVisible && !historyPanelVisible) {
                playerInput.focus();
            }
        }

        async function sendMessageToRin(message) {
            if (window.location.protocol === 'file:') {
                throw new Error('Open this portfolio through the local server first.');
            }

            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    clientId: rinClientId,
                    message,
                }),
            });
            const data = await response.json();

            if (data.blocked) {
                throw makeBlockedChatError();
            }

            if (!response.ok) {
                throw new Error(data.reply || data.error || 'Rin could not reply.');
            }

            if (data.model) {
                connectionStatus.textContent = `OLLAMA: ${data.model}`;
            }

            if (SAFETY_REFUSAL_PATTERN.test(data.reply || '')) {
                throw makeBlockedChatError();
            }

            return data.reply;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();

        function drawRoundedRect(x, y, width, height, radius) {
            const r = Math.min(radius, width / 2, height / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + width - r, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + r);
            ctx.lineTo(x + width, y + height - r);
            ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
            ctx.lineTo(x + r, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function wrapText(text, x, y, maxWidth, lineHeight, maxLines) {
            let line = '';
            let lineCount = 0;

            for (let i = 0; i < text.length; i++) {
                const testLine = line + text[i];

                if (ctx.measureText(testLine).width > maxWidth && line.length > 0) {
                    ctx.fillText(line, x, y);
                    line = text[i];
                    y += lineHeight;
                    lineCount++;

                    if (lineCount >= maxLines - 1) {
                        break;
                    }
                } else {
                    line = testLine;
                }
            }

            if (lineCount < maxLines && line.length > 0) {
                ctx.fillText(line, x, y);
            }
        }

        function drawWrappedWords(text, x, y, maxWidth, lineHeight, maxLines = 99) {
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            const words = String(text || '').split(/\s+/).filter(Boolean);
            let line = '';
            let lines = 0;

            for (const word of words) {
                const testLine = line ? `${line} ${word}` : word;
                if (ctx.measureText(testLine).width > maxWidth && line) {
                    ctx.fillText(line, x, y);
                    y += lineHeight;
                    lines += 1;
                    if (lines >= maxLines) return y;
                    line = word;
                } else {
                    line = testLine;
                }
            }

            if (line && lines < maxLines) {
                ctx.fillText(line, x, y);
                y += lineHeight;
            }

            return y;
        }

        function drawImageCover(image, x, y, width, height) {
            if (!image || !image.width || !image.height) return;

            const sourceAspect = image.width / image.height;
            const targetAspect = width / height;
            let sx = 0;
            let sy = 0;
            let sw = image.width;
            let sh = image.height;

            if (sourceAspect > targetAspect) {
                sw = image.height * targetAspect;
                sx = (image.width - sw) / 2;
            } else {
                sh = image.width / targetAspect;
                sy = Math.min(image.height - sh, Math.max(0, (image.height - sh) * 0.42));
            }

            ctx.drawImage(image, sx, sy, sw, sh, x, y, width, height);
        }

        function drawCvPanel(x, y, width, height, title) {
            ctx.save();
            ctx.shadowBlur = 16;
            ctx.shadowColor = 'rgba(0, 255, 0, 0.24)';
            ctx.fillStyle = 'rgba(0, 10, 0, 0.74)';
            drawRoundedRect(x, y, width, height, 8);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.72)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = '#00ff00';
            ctx.font = 'bold 12px Consolas, "Courier New", monospace';

        function drawSphere() {
            if (!sphereVisible) return;

            const x = canvas.width - 80;
            const y = 80;
            const radius = 30;

            // 繪製球體
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#c9d1cc';
            ctx.fill();

            // 繪製點擊提示符號（波紋擴散效果）
            const time = Date.now() / 1000;

            // 繪製在球體正中間
            const iconX = x;
            const iconY = y;

            ctx.save();
            ctx.strokeStyle = 'rgba(201, 209, 204, 0.58)';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 繪製多個波紋，每個波紋間隔一段時間
            for (let i = 0; i < 3; i++) {
                // 每個波紋延遲 1.2 秒，總週期 3.6 秒
                const waveTime = (time * 0.4 + i * 1.2) % 3.6; // 0-3.6 秒循環
                const progress = waveTime / 3.6; // 0-1 的進度

                // 波紋從小到大擴散
                const waveRadius = 5 + progress * 45; // 從 5px 擴散到 50px

                // 大部分時間保持清晰，接近消失時慢慢變透明
                let waveOpacity;
                if (progress < 0.7) {
                    waveOpacity = 1; // 前 70% 保持完全不透明
                } else {
                    waveOpacity = 1 - (progress - 0.7) / 0.3; // 後 30% 慢慢淡出到 0
                }

                if (waveOpacity > 0.01) {
                    ctx.globalAlpha = waveOpacity;
                    ctx.beginPath();
                    ctx.arc(iconX, iconY, waveRadius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            ctx.restore();

            if (sphereHoverActive) {
                drawClickMouseIndicator(sphereHoverPoint.x + 20, sphereHoverPoint.y + 18);

            if (!portfolioReturnTransitionActive) return;

            const progress = Math.min(
                1,
                (performance.now() - portfolioReturnTransitionStartedAt) / PORTFOLIO_RETURN_TRANSITION_MS,
            );
            const phaseSplit = 0.55;

            if (progress >= phaseSplit && !portfolioReturnResetApplied) {
                resetToOpeningScene();
                portfolioReturnResetApplied = true;

                portfolioReturnTransitionActive = false;

        function getPortfolioReturnCamera() {
            const orb = getPortfolioReturnOrbBounds();
            if (!portfolioReturnTransitionActive) {
                return { scale: 1, focusX: orb.x, focusY: orb.y };
            }

            const progress = Math.min(
                1,
                (performance.now() - portfolioReturnTransitionStartedAt) / PORTFOLIO_RETURN_TRANSITION_MS,
            );
            const phaseSplit = 0.55;
            const maxScale = Math.max(16, Math.hypot(canvas.width, canvas.height) / orb.radius * 1.2);
            let scale;
            let focusProgress;

            if (progress < phaseSplit) {
                const phaseProgress = progress / phaseSplit;
                const ease = 1 - Math.pow(1 - phaseProgress, 3);
                scale = 1 + (maxScale - 1) * ease;
                focusProgress = ease;
            } else {
                const phaseProgress = (progress - phaseSplit) / (1 - phaseSplit);
                const ease = 1 - Math.pow(1 - phaseProgress, 3);
                scale = maxScale - (maxScale - 1) * ease;
                focusProgress = 1 - ease;
            }

            return {
                scale,
                focusX: orb.x + (canvas.width / 2 - orb.x) * focusProgress,
                focusY: orb.y + (canvas.height / 2 - orb.y) * focusProgress,
            };
        }

                    ctx.arc(ropeScreenX, ropeEndY, 8 + pulseProgress * 30, 0, Math.PI * 2);

        function drawAssistantDoor(isSmall, imageTop, availableImageHeight, chatY, time) {
            const doorImage = doorIsOpen ? doorOpenImage : doorClosedImage;
            const doorLoaded = doorIsOpen ? doorOpenLoaded : doorClosedLoaded;
            const doorAspect = doorLoaded && doorImage.height ? doorImage.width / doorImage.height : 0.5;
            const doorHeight = Math.min(isSmall ? 360 : 470, Math.max(isSmall ? 230 : 360, availableImageHeight * (isSmall ? 0.62 : 0.64)));
            const doorWidth = doorHeight * doorAspect;
            const doorCenterX = canvas.width / 2;
            const doorX = Math.max(22, Math.min(doorCenterX - doorWidth / 2, canvas.width - doorWidth - 22));
            const targetDoorY = imageTop + (availableImageHeight - doorHeight) / 2;
            const doorY = Math.max(imageTop + 28, Math.min(targetDoorY, chatY - doorHeight - 30));

            doorBounds = {
                x: doorX,
                y: doorY,
                width: doorWidth,
                height: doorHeight,
            };

            ctx.save();
            ctx.shadowBlur = doorIsOpen ? 24 : 16;
            ctx.shadowColor = doorIsOpen ? 'rgba(0, 255, 120, 0.72)' : 'rgba(0, 255, 0, 0.45)';
            ctx.imageSmoothingEnabled = false;

            if (doorLoaded) {
                ctx.drawImage(doorImage, doorX, doorY, doorWidth, doorHeight);
            } else {
                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.75;
                ctx.strokeRect(doorX, doorY, doorWidth, doorHeight);
            }

            ctx.restore();
        }

        function drawDoorTransitionOverlay() {
            if (!doorTransitionActive || !doorTransitionStartBounds) return;

            const elapsed = performance.now() - doorTransitionStartedAt;
            const progress = Math.min(1, elapsed / DOOR_TRANSITION_MS);
            const ease = progress < 0.5
                ? 4 * progress * progress * progress
                : 1 - Math.pow(-2 * progress + 2, 3) / 2;
            const bounds = doorTransitionStartBounds;
            const targetScale = Math.max(canvas.width / bounds.width, canvas.height / bounds.height) * 1.75;
            const scale = 1 + (targetScale - 1) * ease;
            const centerX = bounds.x + bounds.width / 2;
            const centerY = bounds.y + bounds.height / 2;
            const drawWidth = bounds.width * scale;
            const drawHeight = bounds.height * scale;
            const drawX = centerX - drawWidth / 2;
            const drawY = centerY - drawHeight / 2;

            ctx.save();
            ctx.globalAlpha = Math.min(0.96, progress * 1.1);
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();

            ctx.save();
            ctx.globalAlpha = Math.max(0, 1 - Math.max(0, progress - 0.82) / 0.18);
            ctx.shadowBlur = 36 + ease * 64;
            ctx.shadowColor = 'rgba(0, 255, 100, 0.72)';
            ctx.imageSmoothingEnabled = false;

            if (doorOpenLoaded) {
                ctx.drawImage(doorOpenImage, drawX, drawY, drawWidth, drawHeight);
            } else {
                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 2;
                ctx.strokeRect(drawX, drawY, drawWidth, drawHeight);
            }
            ctx.restore();

            if (progress >= 1) {
                doorTransitionActive = false;
                darkDoorPageReached = true;
                doorTransitionStartBounds = null;
                updateSiteNavigation();
            }
        }

            ctx.fillText('Artificial Intelligence Programme | CGPA: 3.70 (Current)', rightX + 18, rightY + (isShort ? 59 : 76));
            ctx.fillText('Diploma in Information Technology | CGPA: 3.92 | 2022 - 2024', rightX + 18, rightY + (isShort ? 76 : 96));

            rightY += educationH + gap;
            drawCvPanel(rightX, rightY, rightW, experienceH, 'WORK EXPERIENCE');
            ctx.fillStyle = '#00ff00';
            ctx.font = `bold ${mainBodyFontSize}px Consolas, "Courier New", monospace`;
            ctx.fillText('PTT Company | IT Support Intern | July 2023 - October 2023', rightX + 18, rightY + (isShort ? 48 : 58));
            ctx.fillStyle = '#d8ffd8';
            ctx.font = `${bodyFontSize}px Consolas, "Courier New", monospace`;
            let ey = rightY + (isShort ? 68 : 80);
            ey = drawCvBullet(isShort ? 'Provided technical support and troubleshooting for staff.' : 'Provided technical support and troubleshooting assistance for staff.', rightX + 18, ey, rightW - 36, bodyLine, isShort ? 1 : 2);
            ey = drawCvBullet(isShort ? 'Installed and maintained desktops, peripherals, and printers.' : 'Installed, configured, and maintained desktop computers, peripherals, and printers.', rightX + 18, ey + 2, rightW - 36, bodyLine, isShort ? 1 : 2);
            ey = drawCvBullet(isShort ? 'Diagnosed hardware/software issues and configured user accounts.' : 'Diagnosed hardware and software issues, set up user accounts, permissions, and passwords.', rightX + 18, ey + 2, rightW - 36, bodyLine, isShort ? 1 : 2);
            drawCvBullet(isShort ? 'Assisted HR with staff records and daily IT operations.' : 'Assisted HR with staff list checking, staff information updates, attendance records, and daily IT operations.', rightX + 18, ey + 2, rightW - 36, bodyLine, isShort ? 1 : 2);

            rightY += experienceH + gap;
            const halfW = (rightW - gap) / 2;
            drawCvPanel(rightX, rightY, halfW, bottomPanelH, 'PROJECT / CAREER FOCUS');
            ctx.fillStyle = '#d8ffd8';
            ctx.font = `${bodyFontSize}px Consolas, "Courier New", monospace`;
            let fy = rightY + (isShort ? 46 : 55);
            fy = drawCvBullet('Unity / C# development: gameplay scripting, scene logic, UI interaction, and prototype building.', rightX + 16, fy, halfW - 32, bodyLine, isShort ? 3 : 4);
            fy = drawCvBullet('AI application direction: applying AI concepts to interactive tools and user-focused software projects.', rightX + 16, fy + 2, halfW - 32, bodyLine, isShort ? 3 : 4);
            drawCvBullet('Multimedia-oriented thinking: connects technical implementation with user preference and presentation quality.', rightX + 16, fy + 2, halfW - 32, bodyLine, isShort ? 3 : 4);

            const strengthX = rightX + halfW + gap;
            drawCvPanel(strengthX, rightY, halfW, bottomPanelH, 'STRENGTHS');
            ctx.fillStyle = '#d8ffd8';
            ctx.font = `${bodyFontSize}px Consolas, "Courier New", monospace`;
            let ty = rightY + (isShort ? 46 : 55);
            ty = drawCvBullet('Programming fundamentals and problem-solving mindset.', strengthX + 16, ty, halfW - 32, bodyLine, isShort ? 2 : 3);
            ty = drawCvBullet('Hands-on troubleshooting experience in hardware and software support.', strengthX + 16, ty + 2, halfW - 32, bodyLine, isShort ? 2 : 3);
            drawCvBullet('Self-learning attitude toward AI, Unity, and modern software development.', strengthX + 16, ty + 2, halfW - 32, bodyLine, isShort ? 2 : 3);

            updateDarkPageScrollBounds(Math.max(leftY + languagesH, rightY + bottomPanelH));
            ctx.restore();
            drawDarkPageScrollbar();
        }

        function drawAssistantScene() {
            const time = Date.now() / 1000;
            const isSmall = canvas.width < 700;

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.09;

            const gridSize = isSmall ? 36 : 50;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            ctx.restore();

            const scanX = (time * 90) % canvas.width;
            ctx.save();
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.22;
            ctx.beginPath();
            ctx.moveTo(scanX, 0);
            ctx.lineTo(scanX, canvas.height);
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.fillStyle = '#00ff00';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ff00';
            ctx.font = isSmall ? '12px monospace' : '14px monospace';
            ctx.textAlign = 'left';
            ctx.fillText('> GUIDE: ONLINE', 20, 32);
            ctx.fillText('> CHANNEL: PORTFOLIO_LINK', 20, 54);
            ctx.restore();

            const doorTop = isSmall ? 84 : 108;
            const doorAreaHeight = Math.max(250, canvas.height - doorTop - 74);

            drawAssistantDoor(isSmall, doorTop, doorAreaHeight, canvas.height - 28, time);
        }

        function animate() {
            // 如果正在滾動，增加偏移量
            if (isScrolling && scrollOffset < canvas.height) {
                scrollOffset = Math.min(scrollOffset + 8, canvas.height);
                gifContainer.style.transform = `translate(-50%, -50%) translateY(${scrollOffset}px)`;
            }

            // 檢查是否到達 portfolio 頁面
            if (scrollOffset >= canvas.height && !portfolioReached) {
                portfolioReached = true;
                isScrolling = false;
                gifContainer.style.display = 'none';
            }

            if (assistantScrolling) {
                assistantScrollOffset += assistantScrollDirection * 16;
                assistantScrollOffset = Math.max(0, Math.min(canvas.height, assistantScrollOffset));

                if (assistantScrollOffset >= canvas.height) {
                    assistantScrolling = false;
                    assistantPageReached = true;
                    assistantPageEnteredAt = Date.now();
                } else if (assistantScrollOffset <= 0) {
                    assistantScrolling = false;
                    assistantPageReached = false;
                    assistantPageEnteredAt = null;
                }
            }

            // 更新 Pacman 位置（只在 portfolio 頁面時移動）
            syncChatOverlay();

            if (portfolioReached && assistantScrollOffset < canvas.height) {
                pacmanX += pacmanSpeed;
                // 如果 Pacman 移出右側，重置到左側
                if (pacmanX > canvas.width + 100) {
                    pacmanX = -100;
                }
            }

            // 繪製黑色背景
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const portfolioReturnZoomActive = portfolioReturnTransitionActive;
            if (portfolioReturnZoomActive) {
                const orb = getPortfolioReturnOrbBounds();
                const camera = getPortfolioReturnCamera();
                ctx.save();
                ctx.translate(camera.focusX, camera.focusY);
                ctx.scale(camera.scale, camera.scale);
                ctx.translate(-orb.x, -orb.y);
            }

            // 如果已到達 portfolio，只顯示科幻風格 portfolio
            if (darkDoorPageReached) {
                drawDarkDoorPage();
            } else if (portfolioReached) {
                if (assistantScrollOffset > 0) {
                    ctx.save();
                    ctx.translate(0, -assistantScrollOffset);
                    drawSciFiPortfolio();
                    ctx.restore();

                    ctx.save();
                    ctx.translate(0, canvas.height - assistantScrollOffset);
                    drawAssistantScene();
                    ctx.restore();
                } else {
                    drawSciFiPortfolio();
                }
            } else {
                // 滾動中，繪製內容並偏移
                ctx.save();
                ctx.translate(0, scrollOffset);

                drawSphere();
                drawRope();

                ctx.restore();

                // 繪製上方的科幻風格區域
                if (scrollOffset > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(0, 0, canvas.width, scrollOffset);
                    ctx.clip();
                    drawSciFiPortfolio();
                    ctx.restore();
                }
            }

            if (portfolioReturnZoomActive) {
                ctx.restore();
            }

            drawDoorTransitionOverlay();
            drawPortfolioReturnTransitionOverlay();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
